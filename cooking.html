<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="요리놀이">
<title>요리 놀이</title>
<style>
:root{ --u:min(1vw,1vh); --accent:#ff8a3d; --brown:#6b3e1e;
  --grain:radial-gradient(circle,#e3dccb calc(var(--u)*.35),transparent calc(var(--u)*.5)) 0 0/calc(var(--u)*2.2) calc(var(--u)*1.6),#fffdf7; }
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(#fff6e0,#ffe0bd);}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

/* 상단 진행 표시 */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:calc(var(--u)*1.5);padding:calc(var(--u)*1.4) calc(var(--u)*2);min-height:calc(var(--u)*10);}
#progress{flex:1;display:flex;justify-content:center;gap:calc(var(--u)*1);}
.pdot{width:calc(var(--u)*6.5);height:calc(var(--u)*6.5);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*3.6);opacity:.4;border:calc(var(--u)*.5) solid transparent;transition:.3s;}
.pdot.cur{opacity:1;border-color:var(--accent);transform:scale(1.15);}
.pdot.done{opacity:1;background:#d4f3cf;}
#home{position:relative;flex:0 0 auto;width:calc(var(--u)*7.5);height:calc(var(--u)*7.5);border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*4);box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1) rgba(0,0,0,.12);}
#home:active{transform:translateY(calc(var(--u)*.4));box-shadow:none;}

/* 무대 */
/* 무대 배경: 밝은 대리석 조리대 (나무 도구·김발·도마가 묻히지 않게 돌 재질). 가운데가 밝고, 옅은 결 두 줄 */
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;
  background:radial-gradient(ellipse at 50% 38%,rgba(255,255,255,.6),rgba(255,255,255,0) 70%),
    linear-gradient(115deg,rgba(0,0,0,0) 28%,rgba(176,156,128,.16) 29.5%,rgba(0,0,0,0) 31.5%,rgba(0,0,0,0) 61%,rgba(176,156,128,.12) 62.8%,rgba(0,0,0,0) 65%),
    linear-gradient(160deg,rgba(0,0,0,0) 70%,rgba(176,156,128,.1) 71.5%,rgba(0,0,0,0) 73%),
    linear-gradient(#f4ede2,#e6dac8);
  box-shadow:inset 0 calc(var(--u)*1) calc(var(--u)*2) rgba(90,60,30,.12);}
#caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);
  min-height:calc(var(--u)*11);padding:calc(var(--u)*1.2) calc(var(--u)*3);
  font-size:calc(var(--u)*4);font-weight:800;color:var(--brown);text-align:center;background:rgba(255,255,255,.55);}
#capIcon{font-size:calc(var(--u)*4.5);}

.obj{position:absolute;}
/* 이모지 대신 넣는 Fluent 3D 그림: 글자 크기(1em)에 맞춤, 터치는 부모 요소가 받음 */
img.fe{width:1em;height:1em;display:inline-block;vertical-align:-.12em;pointer-events:none;-webkit-user-drag:none;user-select:none;}
.emo{display:flex;align-items:center;justify-content:center;line-height:1;}
.tool{position:absolute;font-size:calc(var(--u)*11);pointer-events:none;z-index:40;transform:var(--tt,translate(-30%,-85%));line-height:1;}
.tool.mid{--tt:translate(-50%,-50%);}
.tool svg{display:block;}
/* 쓰기 전에는 재료 옆에 놓여 살짝 흔들림 */
.tool.rest{animation:toolwig 1.4s ease-in-out infinite;filter:drop-shadow(0 calc(var(--u)*.6) calc(var(--u)*.6) rgba(0,0,0,.25));}
@keyframes toolwig{0%,100%{transform:var(--tt,translate(-30%,-85%)) rotate(-9deg)}50%{transform:var(--tt,translate(-30%,-85%)) rotate(7deg)}}
/* 병에서 짜져 나오는 줄기 */
.pour{position:absolute;width:calc(var(--u)*1.6);border-radius:calc(var(--u)*1);z-index:4;pointer-events:none;transform-origin:top center;animation:pourin .25s ease-out;}
@keyframes pourin{from{transform:scaleY(0)}}
.particle{position:absolute;font-size:calc(var(--u)*4);pointer-events:none;z-index:50;line-height:1;
  transform:translate(-50%,-50%);animation:fly .9s ease-out forwards;}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
.ftext{position:absolute;z-index:55;pointer-events:none;font-weight:900;color:#ff6a00;white-space:nowrap;
  font-size:calc(var(--u)*6);-webkit-text-stroke:calc(var(--u)*.25) #fff;transform:translate(-50%,-50%);animation:rise-t 1s ease-out forwards;}
.ftext.big{font-size:calc(var(--u)*10);color:#ff4f81;}
@keyframes rise-t{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{transform:translate(-50%,-60%) scale(1.1);opacity:1}
  100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.shine{animation:shine 1s ease-in-out 2;}
@keyframes shine{50%{filter:brightness(1.2) drop-shadow(0 0 calc(var(--u)*2) #fff6a0)}}
.wiggle{animation:wiggle 1s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes popin{from{transform:scale(0)}}

/* 힌트 손가락 */
.hint{position:absolute;z-index:60;pointer-events:none;width:0;height:0;}
.hand{position:absolute;left:calc(var(--u)*-3.5);top:calc(var(--u)*-1);font-size:calc(var(--u)*10);line-height:1;
  filter:drop-shadow(0 calc(var(--u)*.5) calc(var(--u)*.6) rgba(0,0,0,.3));}

/* 메뉴 / 끝 화면 */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);padding:calc(var(--u)*2);}
.bigemo{font-size:calc(var(--u)*24);line-height:1;animation:bounce 1.4s ease-in-out infinite;}
@keyframes bounce{50%{transform:translateY(calc(var(--u)*-3)) rotate(-4deg)}}
.title{font-size:calc(var(--u)*7);font-weight:900;color:var(--brown);text-align:center;}
.btnrow{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:center;}
.bigbtn{font-size:calc(var(--u)*5);font-weight:900;color:#fff;background:linear-gradient(#ffa54f,#ff7a1a);border:none;
  border-radius:calc(var(--u)*6);padding:calc(var(--u)*2.2) calc(var(--u)*6);box-shadow:0 calc(var(--u)*1) 0 #d65f00;font-family:inherit;}
.bigbtn.green{background:linear-gradient(#7fd36b,#45a83a);box-shadow:0 calc(var(--u)*1) 0 #2e7d24;}
.bigbtn:active{transform:translateY(calc(var(--u)*.8));box-shadow:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,calc(var(--u)*24));gap:calc(var(--u)*2.5);justify-content:center;width:100%;}
.card{position:relative;height:calc(var(--u)*24);background:#fff;border-radius:calc(var(--u)*4);display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:0 calc(var(--u)*.9) 0 #f0c9a0;font-size:calc(var(--u)*3.3);font-weight:900;color:var(--brown);}
.card:active{transform:translateY(calc(var(--u)*.8));box-shadow:none;}
.card .ic{font-size:calc(var(--u)*12);line-height:1;height:calc(var(--u)*14);display:flex;align-items:center;justify-content:center;}
.card .stamp{position:absolute;top:calc(var(--u)*-1.5);right:calc(var(--u)*-1);font-size:calc(var(--u)*7);transform:rotate(15deg);}

/* 공통 소품 */
.sink{position:absolute;left:8%;right:8%;bottom:4%;height:58%;background:linear-gradient(#cdeeff,#8fd0ff);
  border:calc(var(--u)*1.2) solid #e3eaf0;border-radius:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*8) calc(var(--u)*8);}
.stream{position:absolute;left:calc(50% - var(--u)*.9);top:calc(var(--u)*9);width:calc(var(--u)*1.8);height:30%;
  background:repeating-linear-gradient(rgba(110,195,255,.9) 0 calc(var(--u)*2),rgba(170,220,255,.6) calc(var(--u)*2) calc(var(--u)*4));
  border-radius:calc(var(--u)*1);animation:flow .5s linear infinite;}
@keyframes flow{to{background-position:0 calc(var(--u)*4)}}
.dirt{position:absolute;width:calc(var(--u)*6.5);height:calc(var(--u)*5.5);margin:calc(var(--u)*-2.75) 0 0 calc(var(--u)*-3.25);
  background:radial-gradient(circle,#6e4524 0 40%,#8a5d39 42% 62%,transparent 66%);border-radius:50%;transition:opacity .2s,transform .3s;}
.dirt.clean{transform:scale(0);opacity:0!important;}
/* 도마: 나무 3단 그라데이션 + 세로 나뭇결 + 윗면 반사 (그림체 규칙: .claude/skills/svg-3d-style) */
.board{border-radius:calc(var(--u)*3);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 calc(var(--u)*1.3),rgba(120,70,20,.05) calc(var(--u)*1.3) calc(var(--u)*2.8)),
    linear-gradient(#f0c98f,#dba86a 55%,#b9844a);
  box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*2) rgba(0,0,0,.2),inset 0 calc(var(--u)*.5) 0 rgba(255,255,255,.35),inset 0 calc(var(--u)*-.6) 0 rgba(120,70,20,.25);}
/* 접시: 가운데 오목, 테두리 고리, 바깥 가장자리 어둡게 */
.plate{border-radius:50%;
  background:radial-gradient(ellipse at 50% 44%,#fff 0 48%,#eef0f2 52%,#dde2e7 57%,#fff 61%,#f2f4f6 78%,#d6dbe1 100%);
  box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*1.6) rgba(0,0,0,.18);}
.tray{background:rgba(255,255,255,.6);border-radius:calc(var(--u)*4);}
.seg{position:absolute;top:0;height:100%;overflow:hidden;transition:transform .3s ease-out;}
.seginner{position:absolute;top:0;height:100%;}
.cutline{position:absolute;top:-6%;height:112%;width:0;border-left:calc(var(--u)*.7) dashed #fff;margin-left:calc(var(--u)*-.35);z-index:3;
  filter:drop-shadow(0 0 calc(var(--u)*.4) rgba(0,0,0,.5));animation:blink 1s ease-in-out infinite;}
.cutline.gone{display:none;}
@keyframes blink{50%{opacity:.35}}
.drag{z-index:10;}
.drag.dragging{z-index:30;filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*1) rgba(0,0,0,.25));}
.locked{opacity:.35;filter:grayscale(.6);}
.paintcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.firebtn{border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a6b,#e0291c);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:calc(var(--u)*7);line-height:1;box-shadow:0 calc(var(--u)*1) 0 #9e1b12;z-index:5;}
.firebtn small{font-size:calc(var(--u)*2.6);font-weight:900;margin-top:calc(var(--u)*.6);}
.firebtn.on{filter:grayscale(.7);box-shadow:none;transform:translateY(calc(var(--u)*1));}
.ring{opacity:0;transition:opacity .3s;}
.ring.on{opacity:1;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring circle{fill:#fff;stroke-width:9;}
.ring .ringbg{stroke:#ffe1c4;}
.ring .ringfg{fill:none;stroke:var(--accent);stroke-dasharray:277;stroke-dashoffset:277;stroke-linecap:round;}
.ringlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*6);}
.bub{position:absolute;border-radius:50%;z-index:20;
  background:radial-gradient(circle at 30% 30%,#fff 0 14%,rgba(210,240,255,.55) 40%,rgba(120,200,255,.3));
  border:calc(var(--u)*.35) solid rgba(255,255,255,.95);animation:bubrise 2.6s linear forwards;}
@keyframes bubrise{to{transform:translateY(calc(var(--u)*-30));opacity:.3}}
/* 병(마요네즈, 참기름) */
.btl{z-index:5;}
.btl .cap{position:absolute;left:32%;width:36%;top:0;height:16%;background:#e53935;border-radius:calc(var(--u)*1) calc(var(--u)*1) 0 0;}
.btl .tube{position:absolute;left:0;right:0;top:14%;bottom:0;background:linear-gradient(90deg,#f3e9c4,#fffdf3 45%,#efe2b5);
  border-radius:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*2) calc(var(--u)*2);display:flex;align-items:center;justify-content:center;text-align:center;
  color:#e53935;font-weight:900;font-size:calc(var(--u)*3.2);box-shadow:0 calc(var(--u)*.8) calc(var(--u)*1.5) rgba(0,0,0,.15);}
.btl.oilb .cap{background:#3a3a3a;}
.btl.oilb .tube{background:linear-gradient(90deg,#c98a16,#f2c14e 45%,#b97a10);color:#fff;font-size:calc(var(--u)*2.6);}
.squeeze{animation:squeeze .3s;}
@keyframes squeeze{50%{transform:scaleX(1.18) scaleY(.85)}}

/* 냄비 */
.stove .stovetop{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(#5b5b5b,#333);border-radius:calc(var(--u)*2);}
.stove .flames{position:absolute;left:18%;right:18%;bottom:12%;height:24%;display:flex;justify-content:space-around;align-items:flex-end;
  font-size:calc(var(--u)*7.5);line-height:1;opacity:0;transition:opacity .3s;}
.stove .flames.on{opacity:1;}
.stove .flames span{animation:flick .25s ease-in-out infinite alternate;transform-origin:50% 100%;}
@keyframes flick{to{transform:scaleY(1.2) scaleX(.9)}}
.pot{position:absolute;left:9%;width:82%;top:0;height:76%;}
.potbody{position:absolute;left:0;right:0;top:18%;bottom:0;background:linear-gradient(90deg,#8d959e,#dfe4e9 40%,#8a929a);
  border-radius:0 0 calc(var(--u)*5) calc(var(--u)*5);}
.potrim{position:absolute;left:-3%;right:-3%;top:6%;height:24%;background:#b6bec6;border-radius:50%;}
.water{position:absolute;left:3%;right:3%;top:10%;height:16%;background:radial-gradient(#8fdcff,#3aa7e6);border-radius:50%;}
.handle{position:absolute;top:24%;width:12%;height:10%;background:#5f666d;border-radius:calc(var(--u)*2);}
.handle.l{left:-11%}.handle.r{right:-11%}
.potegg{position:absolute;top:-55%;font-size:calc(var(--u)*9);line-height:1;transform:translateX(-50%);animation:bob 1.2s ease-in-out infinite;}
@keyframes bob{50%{transform:translateX(-50%) translateY(calc(var(--u)*-.8)) rotate(8deg)}}

/* 계란 */
.egg{border-radius:50% 50% 50% 50% / 60% 60% 42% 42%;overflow:hidden;
  box-shadow:inset calc(var(--u)*-1.5) calc(var(--u)*-1.5) calc(var(--u)*3) rgba(0,0,0,.12),0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.15);}
.egg.shell{background:radial-gradient(circle at 35% 30%,#fbe9cd,#e8c290 70%,#d9a86f);}
.egg.peeled{background:radial-gradient(circle at 35% 30%,#fff,#f5f2eb 60%,#e4ddd0);}
.cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.shellpc{position:absolute;background:radial-gradient(circle at 30% 30%,#f7dfba,#e2b682);}
.flypiece{position:absolute;width:calc(var(--u)*6);height:calc(var(--u)*5);margin:calc(var(--u)*-2.5) 0 0 calc(var(--u)*-3);
  background:#e6bb86;border-radius:20% 40% 30% 50%;pointer-events:none;z-index:45;}

/* 그릇 */
/* 그릇: 바닥 그림자, 몸통은 가로 3단(왼쪽 빛) + 왼쪽 위 반사광, 안쪽은 오목하게 그늘 */
.bowl::before{content:'';position:absolute;left:14%;right:14%;bottom:-7%;height:14%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.22),rgba(0,0,0,0) 70%);}
.bowl .body{position:absolute;left:0;right:0;top:22%;bottom:0;border-radius:0 0 50% 50% / 0 0 100% 100%;
  background:radial-gradient(ellipse 22% 30% at 24% 38%,rgba(255,255,255,.55),rgba(255,255,255,0)),
    linear-gradient(90deg,#3a8fcb,#6cc0f0 24%,#4aa3e0 55%,#2a78b5 82%,#1c5f94);}
.bowl .rim{position:absolute;left:0;right:0;top:0;height:46%;border-radius:50%;background:linear-gradient(#eef8ff,#cfe9fa);border:calc(var(--u)*.9) solid #3f97d3;
  box-shadow:inset 0 calc(var(--u)*.5) calc(var(--u)*.5) rgba(255,255,255,.7);}
.bowl .inside{position:absolute;left:7%;right:7%;top:5%;height:36%;border-radius:50%;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#d8eefc,#a9d3f0 70%,#8cc3e8);box-shadow:inset 0 calc(var(--u)*1.2) calc(var(--u)*1.5) rgba(0,40,80,.25);}
.chunk{position:absolute;border-radius:45% 55% 50% 40%;background:radial-gradient(circle at 50% 55%,#ffcc33 0 30%,#fff 33%);
  box-shadow:inset calc(var(--u)*-.4) calc(var(--u)*-.4) calc(var(--u)*.8) rgba(0,0,0,.1);transition:transform .2s,opacity .2s;}
.mash{position:absolute;left:4%;right:4%;top:8%;bottom:4%;border-radius:50%;background:radial-gradient(#ffe27a,#ffcf3a);transform:scale(0);transition:transform .2s;}
.mash .pale{position:absolute;inset:0;border-radius:50%;background:radial-gradient(#fff6cf,#ffe795);opacity:0;}
.blob{position:absolute;width:22%;height:40%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#f4ecd2);
  box-shadow:0 0 calc(var(--u)*.6) rgba(0,0,0,.12);animation:popin .3s ease-out;}

/* 샌드위치 */
.breadtop{background:#f9e2b2;border:calc(var(--u)*1.8) solid #c9883a;border-radius:42% 42% 10% 10% / 34% 34% 8% 8%;overflow:hidden;
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.18);}
.stack{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;}
.layer{flex:0 0 auto;width:90%;margin-bottom:calc(var(--u)*-.6);animation:dropin .35s ease-out;position:relative;}
@keyframes dropin{from{transform:translateY(calc(var(--u)*-14));opacity:0}}
.L-bottom{height:calc(var(--u)*7);background:linear-gradient(#f6d29a,#e3ad62);border:calc(var(--u)*.8) solid #b8762f;border-radius:calc(var(--u)*2);margin-bottom:0;}
.L-egg{width:86%;height:calc(var(--u)*3.6);background:#ffd84d;border-radius:calc(var(--u)*2);}
.L-lettuce{width:97%;height:calc(var(--u)*4.6);
  background:radial-gradient(circle at 50% 0,#6cbf45 68%,transparent 71%) bottom/calc(var(--u)*4) calc(var(--u)*2) repeat-x,
             linear-gradient(#94dc66,#6cbf45) top/100% 62% no-repeat;}
.L-tomato{width:88%;height:calc(var(--u)*3.6);display:flex;gap:calc(var(--u)*.8);}
.L-tomato i{flex:1;background:radial-gradient(#ff7a6b,#d93025);border-radius:calc(var(--u)*1.6);}
.L-cheese{width:100%;height:calc(var(--u)*2.6);background:#ffc93c;border-radius:calc(var(--u)*.5);}
.L-cheese::before,.L-cheese::after{content:'';position:absolute;top:100%;border-left:calc(var(--u)*1.6) solid transparent;
  border-right:calc(var(--u)*1.6) solid transparent;border-top:calc(var(--u)*2.6) solid #ffc93c;}
.L-cheese::before{left:18%}.L-cheese::after{left:68%}
.L-top{height:calc(var(--u)*11);background:linear-gradient(#e9b064,#f6d29a 65%);border:calc(var(--u)*.8) solid #b8762f;
  border-radius:50% 50% calc(var(--u)*2) calc(var(--u)*2) / 80% 80% calc(var(--u)*2) calc(var(--u)*2);}
.clipeat{transition:clip-path .25s,-webkit-clip-path .25s;}

/* 바나나, 과일 꼬치 */
.banana .flesh{position:absolute;left:27%;right:27%;top:8%;bottom:0;background:linear-gradient(90deg,#fff3c4,#fffbe6 50%,#f5e3a0);
  border-radius:45% 45% 40% 40% / 30% 30% 18% 18%;}
.banana .bpeel{position:absolute;top:8%;bottom:0;width:22%;background:linear-gradient(90deg,#f2c100,#ffe14d 50%,#f2c100);
  transform-origin:50% 100%;transition:transform .5s ease-in,opacity .5s;border-radius:40% 40% 30% 30% / 20% 20% 10% 10%;
  box-shadow:inset 0 0 calc(var(--u)*.6) rgba(150,110,0,.4);}

/* ================= 음성 재생 (mp3 우선, 없으면 기기 음성) =================
   voice/list.js의 VOICE_FILES에 있는 문장은 voice/<이름>.mp3를 재생하고, 없으면 기기 음성(Web Speech API)으로 읽습니다.
   문장 배열을 주면 조각 mp3를 차례로 이어서 재생합니다. 한 조각이라도 mp3가 없으면 전체를 기기 음성으로 읽습니다.
   mp3 이름은 문장의 FNV-1a 해시(16진수 8자리)입니다. tools/voice-lines.html도 같은 방식으로 이름을 만듭니다.
   이 코드는 index.html, cooking.html, hangul.html, numbers.html, coloring.html에 똑같이 들어 있습니다. 고칠 때는 다섯 파일을 함께 고칩니다. */
const VOICE = (() => {
  const norm = t => String(t).trim().replace(/\s+/g, ' ');
  const hash = t => { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
  const heard = new Set();   // 지금까지 읽은 문장 (문장 목록 점검용)
  const bufs = {};
  let ctx = null, src = null, token = 0;
  function unlock() {        // 아이패드는 터치 안에서 소리 장치를 켜야 그 뒤에 소리가 납니다
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { /* 소리 장치 없음 */ }
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlock, true));
  function load(h) {
    return bufs[h] = bufs[h] || fetch(`voice/${h}.mp3`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no)))
      .catch(e => { delete bufs[h]; throw e; });

  function stop() {
    token++;

  }

  function play(parts, tts, onend) {
    stop();

    if (!list.length) return;
    list.forEach(t => heard.add(t));
    const files = window.VOICE_FILES || {}, hs = list.map(hash);
    unlock();
    if (!ctx || !hs.every((h, i) => files[h] === list[i])) { tts(list.join(' ')); return; }
    const my = token;
    Promise.all(hs.map(load)).then(bs => {
      let i = 0;
      const next = () => {
        if (my !== token) return;
        if (i >= bs.length) { src = null; if (onend) onend(); return; }
        src = ctx.createBufferSource(); src.buffer = bs[i++]; src.connect(ctx.destination);
        src.onended = next; src.start();
      };
      next();
    }).catch(() => { if (my === token) tts(list.join(' ')); });
  }
  return { play, stop, heard, hash, norm };
})();

function draggable(elm,getTarget,onDrop){
  let sx=0,sy=0,pid=null;
  elm.addEventListener('pointerdown',e=>{
    if(elm.dataset.locked){SFX.lock();retrigger(elm,'shake');return;}
    e.preventDefault();elm.classList.remove('wiggle');pid=e.pointerId;try{elm.setPointerCapture(pid);}catch(_){}
    sx=e.clientX;sy=e.clientY;elm.classList.add('dragging');elm.style.transition='none';SFX.boop();
  });
  elm.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;elm.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.12)`;});
  const up=e=>{
    if(e.pointerId!==pid)return;pid=null;elm.classList.remove('dragging');
    const t=typeof getTarget==='function'?getTarget():getTarget;
    const a=elm.getBoundingClientRect(),b=t.getBoundingClientRect();
    const cx=a.left+a.width/2,cy=a.top+a.height/2,pad=Math.max(b.width,b.height)*.35;
    if(cx>b.left-pad&&cx<b.right+pad&&cy>b.top-pad&&cy<b.bottom+pad)onDrop(elm,{x:cx-sRect().left,y:cy-sRect().top});
    else{elm.style.transition='transform .35s';elm.style.transform='';}
  };
  elm.addEventListener('pointerup',up);elm.addEventListener('pointercancel',up);
}

function cutTask(done,{html,W,H,n,after}){
  box(stage,'board',50,54,Math.max(72,W+16),Math.max(30,H+18));
  const wrap=box(stage,'',50,52,W,H);
  const segs=[];
  for(let i=0;i<n;i++){const s=el('div','seg',wrap);s.style.left=(i*100/n)+'%';s.style.width=(100/n)+'%';
    const inner=el('div','seginner',s,html);inner.style.width=uu(W);inner.style.left=uu(-i*W/n);segs.push(s);}
  const lines=[];for(let j=1;j<n;j++){const l=el('div','cutline',wrap);l.style.left=(j*100/n)+'%';l.idx=j;lines.push(l);}
  useTool('🔪',wrap);
  let start=null,used=false;
  const cut=l=>{
    l.cut=true;l.classList.add('gone');SFX.chop();const c=center(l);floatText(c.x,c.y-c.h*.3,'싹둑!');
    const total=lines.filter(L=>L.cut).length;

    if(lines.every(L=>L.cut)){if(after)after(segs);later(done,500);}

      if(p.y-start.y>U()*Math.max(H,14)*.28&&inside(p,wrap,U()*8)){

  });

}
// 문질러 칠하기(바르기, 뿌리기). 칠한 면적이 cover 비율을 넘으면 완료
function paintTask(done,o){
  const target=o.target,cv=el('canvas','paintcv',target);if(o.opacity)cv.style.opacity=o.opacity;
  const ctx=cv.getContext('2d'),G=8,Rr=o.R||.1,cells=new Set(),valid=[];
  for(let gx=0;gx<G;gx++)for(let gy=0;gy<G;gy++){const cx=(gx+.5)/G,cy=(gy+.5)/G;if(!o.round||Math.hypot(cx-.5,cy-.5)<.46)valid.push(gx+','+gy);}
  const fit=()=>{const dpr=window.devicePixelRatio||1;if(!cv.clientWidth)return;
    if(cv.width!==Math.round(cv.clientWidth*dpr)){const old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;
      if(cv.width)old.getContext('2d').drawImage(cv,0,0);cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);
      if(old.width)ctx.drawImage(old,0,0,cv.width,cv.height);}};
  requestAnimationFrame(fit);const onR=()=>fit();addEventListener('resize',onR);addCleanup(()=>removeEventListener('resize',onR));
  useTool(o.tool||'🥄',target,o.toolCls);
  let fin=false;
  const dab=p=>{
    const r=relIn(p,cv);if(r.x<-.15||r.x>1.15||r.y<-.15||r.y>1.15)return;
    if(o.dab)o.dab(ctx,r.x*cv.width,r.y*cv.height,Rr*cv.width,Rr*cv.height,cv.width);else{   // o.dab: 한 번 찍는 그림을 직접 그림 (예: 밥 덩이)
    ctx.fillStyle=o.color;ctx.beginPath();ctx.ellipse(r.x*cv.width,r.y*cv.height,Rr*cv.width,Rr*cv.height,0,0,Math.PI*2);ctx.fill();
    if(o.grain){for(let k=0;k<3;k++)drawGrain(ctx,(r.x+rand(-Rr,Rr)*.9)*cv.width,(r.y+rand(-Rr,Rr)*.9)*cv.height,cv.width);}
    else if(o.speck&&Math.random()<.5){ctx.fillStyle=o.speck;ctx.beginPath();ctx.arc((r.x+rand(-.05,.05))*cv.width,(r.y+rand(-.05,.05))*cv.height,cv.width*.012,0,Math.PI*2);ctx.fill();}}
    for(let gx=0;gx<G;gx++)for(let gy=0;gy<G;gy++){if(Math.hypot((gx+.5)/G-r.x,(gy+.5)/G-r.y)<Rr*1.1)cells.add(gx+','+gy);}
  };
  const line=(a,b)=>{const steps=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/(U()*1.5)));for(let i=1;i<=steps;i++)dab({x:a.x+(b.x-a.x)*i/steps,y:a.y+(b.y-a.y)*i/steps});};
  const check=()=>{if(fin)return;const got=valid.filter(k=>cells.has(k)).length;if(got/valid.length>=(o.cover||.8)){fin=true;target.classList.add('shine');done();}};
  strokes({down:p=>{if(fin)return;fit();dab(p);check();},move:(p,l)=>{if(fin)return;rubSound();line(l,p);check();}});
  hintFn=()=>{const k=valid.find(k=>!cells.has(k));if(!k)return null;const[gx,gy]=k.split(',').map(Number);const r=center(target);
    return{type:'rub',at:{x:r.x-r.w/2+(gx+.5)/G*r.w,y:r.y-r.h/2+(gy+.5)/G*r.h}};};
  return cv;
}

    if(phase===1){chunks.forEach(c=>{c.style.transform=`scale(${1-pr*.85})`;c.style.opacity=1-pr*.7;});mash.style.transform=`scale(${pr})`;
      if(pr>=1){phase=2;chunks.forEach(c=>c.remove());startMayo();}}
    else{blobs.forEach(b=>b.style.opacity=1-pr);mash.querySelector('.pale').style.opacity=pr;if(pr>=1){phase=4;done();}}
  }});
  function startMayo(){
    SFX.good();say('마요네즈를 쭉 짜요! 통을 톡톡 눌러요.');

      });
    });
  }

// 재료를 마음껏 올리기: 피자 위에 정해 둔 자리(가운데 1, 안쪽 원 6, 바깥 원 12)가 있고,

const TOP_SLOTS=[[50,50],
  ...Array.from({length:6},(_,i)=>{const a=i*Math.PI/3-Math.PI/2;return[50+Math.cos(a)*18,50+Math.sin(a)*18];}),
  ...Array.from({length:12},(_,i)=>{const a=i*Math.PI/6-Math.PI/2+Math.PI/12;return[50+Math.cos(a)*33,50+Math.sin(a)*33];})];
function pzTop(done){
  S.tops=[];const P=46;const pz=renderPizza(50,44,P);
  const tr=box(stage,'tray',50,88,90,16);tr.style.width='94%';tr.style.left='3%';let n=0,fin=false;
  const used=new Set();
  const btn=el('button','bigbtn green donebtn',stage,'✅ 다 올렸어요');btn.style.display='none';
  onTap(btn,()=>{if(fin||!n)return;fin=true;SFX.good();btn.classList.add('on');later(done,300);});
  const items=TOPS.map((t,i)=>{const e=emo(stage,t,10+i*16,88,12,'drag');
    draggable(e,pz,(elm,at)=>{
      resetDrag(elm);if(fin)return;
      const r=relIn(at,pz);
      const free=TOP_SLOTS.map((s,k)=>k).filter(k=>!used.has(k))
        .sort((a,b)=>Math.hypot(TOP_SLOTS[a][0]-r.x*100,TOP_SLOTS[a][1]-r.y*100)-Math.hypot(TOP_SLOTS[b][0]-r.x*100,TOP_SLOTS[b][1]-r.y*100));
      if(!free.length){SFX.lock();retrigger(btn,'shake');say('피자가 꽉 찼어요! 초록 버튼을 눌러요!');return;}
      free.slice(0,3).forEach(k=>{
        used.add(k);const tp={e:t,x:TOP_SLOTS[k][0],y:TOP_SLOTS[k][1],r:0};S.tops.push(tp);
        const sp=el('span','ztop',pz,sliceSvg(t,P*.15,0));sp.style.left=tp.x+'%';sp.style.top=tp.y+'%';sp.style.animation='popin .3s';
      });

      if(n===1){btn.style.display='';btn.classList.add('wiggle');later(()=>say('다 올렸으면 초록 버튼을 눌러요!'),700);}

const PADDLE_SVG=`<svg viewBox="0 0 100 100" style="width:${uu(14)};height:${uu(14)};display:block;overflow:visible">
  <defs><linearGradient id="pdlh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3b4"/><stop offset=".5" stop-color="#e2c27e"/><stop offset="1" stop-color="#b88a46"/></linearGradient>

// 밥 한 덩이 찍기: 가장자리가 부드러운 하얀 덩어리 + 그림자·반사광이 있는 밥알 (canvas)
function riceClump(ctx,x,y,rx,ry,W){
  const g=ctx.createRadialGradient(x,y,0,x,y,rx);
  // 가운데부터 85%까지는 꽉 찬 밥, 바깥 15%만 짧게 사라짐 → 가장자리가 흐리게 번지지 않고 몽글몽글하게
  g.addColorStop(0,'#fffefb');g.addColorStop(.7,'#fbf6ea');g.addColorStop(.85,'rgba(238,228,204,.95)');g.addColorStop(1,'rgba(232,220,192,0)');
  ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);ctx.translate(-x,-y);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rx,0,Math.PI*2);ctx.fill();ctx.restore();
  for(let k=0;k<5;k++){const a=Math.random()*Math.PI*2,d=Math.random()*.8;drawGrain(ctx,x+Math.cos(a)*rx*d,y+Math.sin(a)*ry*d,W);}
}
// 밥 덩이 중심을 가장자리에서 조금 안쪽으로만 찍어, 밥 층 가장자리가 반듯하게 잘리지 않고 울퉁불퉁하게
function riceClumpIn(ctx,x,y,rx,ry,W){const H=ctx.canvas.height;
  riceClump(ctx,Math.min(W-rx*.55,Math.max(rx*.55,x)),Math.min(H-ry*.55,Math.max(ry*.55,y)),rx,ry,W);}
// 주걱 아래로 밥알이 톡톡 튀는 효과
function riceBits(p){
  for(let i=0;i<2;i++){const b=el('div','ricebit',stage);b.style.left=p.x+'px';b.style.top=p.y+'px';
    b.style.setProperty('--dx',uu(rand(-5,5)));b.style.setProperty('--dy',uu(rand(-7,-2)));b.style.setProperty('--r',rand(-180,180)+'deg');
    setTimeout(()=>b.remove(),650);}
}
function kbRice(done){
  const{nori}=kbMat();const area=el('div','ricearea',nori);let last=0;
  stageOn('pointermove',e=>{const now=Date.now();if(now-last<120)return;const p=pt(e),r=center(area);
    if(Math.abs(p.x-r.x)<r.w/2&&Math.abs(p.y-r.y)<r.h/2){last=now;riceBits(p);}});
  const cv=paintTask(()=>{
    // 다 펴면 덜 칠한 빈틈을 0.5초 동안 밥 덩이로 채우고, 그 그림을 저장해 다음 단계(재료 올리기·말기)에서 그대로 씀
    const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,rx=.11*W,ry=.11*H,cols=6,rows=5;let row=0;
    const step=()=>{for(let c=0;c<cols;c++)riceClumpIn(ctx,(c+.5)/cols*W+rand(-rx,rx)*.6,(row+.5)/rows*H+rand(-ry,ry)*.6,rx*rand(.85,1.15),ry*rand(.85,1.15),W);
      if(++row<rows)later(step,90);else{try{S.riceImg=cv.toDataURL('image/png');}catch(e){}S.rice=1;done();}};
    step();
  },{target:area,R:.11,cover:.75,tool:PADDLE_SVG,dab:riceClumpIn});
}

function smBlend(done){
  const b=makeBlender(60,50);const ring=makeRing(20,30,16,'🌀');ring.set(0);
  let pr=0,run=false,told=false;
  const stop=()=>{run=false;b.bl.classList.remove('shakeloop');b.btn.classList.remove('press');
    if(pr>0&&pr<1&&!told){told=true;say('계속 꾹 누르고 있어요!');}};
  b.btn.addEventListener('pointerdown',e=>{e.preventDefault();if(pr>=1)return;run=true;b.bl.classList.add('shakeloop');b.btn.classList.add('press');
    try{b.btn.setPointerCapture(e.pointerId);}catch(_){}});

  every(()=>{if(!run)return;pr=Math.min(1,pr+.1/3);SFX.blend();b.fr.style.opacity=1-pr;b.milk.style.opacity=1-pr;b.pink.style.height=(50*pr)+'%';ring.set(pr);

/* ---------- 진행 ---------- */
const PRAISE=['잘했어요!','최고예요!','우와, 멋져요!','참 잘했어요!','대단해요!'];

/* ---------- 음성 문장 목록 ---------- */
// 이 놀이에서 읽을 수 있는 문장을 모두 돌려줍니다. tools/voice-lines.html이 이 목록으로 mp3 문장표를 만듭니다.
// 단계 안에서 say()로 읽는 문장을 새로 넣으면 아래 EXTRA에도 꼭 추가합니다.
function voiceLines(){
  const EXTRA=['만들고 싶은 요리를 눌러요!','그만할까요?',
    '보글보글! 거품을 톡톡 터뜨려 볼까요?','마요네즈를 쭉 짜요! 통을 톡톡 눌러요.','이제 쓱쓱 섞어요!','마지막으로 빵을 덮어요!',
    '지글지글! 거품을 톡톡 터뜨려 볼까요?','피자가 꽉 찼어요! 초록 버튼을 눌러요!','다 올렸으면 초록 버튼을 눌러요!',
    '빨간 버튼을 눌러서 구워요!','오븐에서 맛있게 익고 있어요!','계속 꾹 누르고 있어요!','이제 컵을 눌러서 쭉쭉 마셔요!'];
  return [...EXTRA,...PRAISE,...Object.values(RECIPES).flatMap(r=>[r.end,...r.steps.map(s=>s.say)])];
}
function renderProgress(){
  $('#progress').innerHTML=R&&stepIdx>=0?R.steps.map((s,i)=>`<div class="pdot ${i<stepIdx?'done':''} ${i===stepIdx?'cur':''}">${s.icon}</div>`).join(''):'';
}
function startRecipe(key){R=RECIPES[key];R.key=key;S={};startStep(0);}
function startStep(i){
  clearStage();stepIdx=i;stepDone=false;renderProgress();
  R.steps[i].setup(complete);say(R.steps[i].say);resetIdle();
}
function complete(){
  if(stepDone)return;stepDone=true;clearTimeout(idleT);hideHint();
  SFX.good();const w=stage.clientWidth,h=stage.clientHeight;
  burst(w/2,h/2,['⭐','✨','🌟'],16);
  const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];floatText(w/2,h*.35,p,true);say(p);
  later(()=>{stepIdx+1<R.steps.length?startStep(stepIdx+1):showEnd();},2300);
}

/* ---------- 도장 저장 (아이패드 브라우저에 저장) ---------- */
function getStamps(){try{return JSON.parse(localStorage.getItem('cook-stamps')||'{}');}catch(e){return{};}}
function addStamp(k){const s=getStamps();s[k]=(s[k]||0)+1;try{localStorage.setItem('cook-stamps',JSON.stringify(s));}catch(e){}}

/* ---------- 메뉴 / 끝 화면 ---------- */
function showMenu(){
  clearStage();stepIdx=-1;R=null;renderProgress();
  const sc=el('div','screen',stage);el('div','title',sc,'무엇을 만들까요?');
  const g=el('div','grid',sc);const st=getStamps();
  Object.entries(RECIPES).forEach(([k,r])=>{
    const c=el('div','card',g,`<div class="ic">${r.icon}</div>${r.name}${st[k]?'<div class="stamp">⭐</div>':''}`);
    c.addEventListener('click',()=>{audioInit();SFX.good();startRecipe(k);});
  });
  curSay='만들고 싶은 요리를 눌러요!';$('#capText').textContent=curSay;
  if(AC)speak(curSay);
}
function showEnd(){
  addStamp(R.key);
  clearStage();stepIdx=R.steps.length;renderProgress();stepDone=true;
  const sc=el('div','screen',stage);
  el('div','bigemo',sc,R.icon);el('div','title',sc,R.name+' 요리사 완성!');
  const row=el('div','btnrow',sc);
  const again=el('button','bigbtn',row,'다시 하기 🔄');const menu=el('button','bigbtn green',row,'다른 요리 🍽️');
  const key=R.key;
  again.addEventListener('click',()=>{audioInit();startRecipe(key);});
  menu.addEventListener('click',()=>{audioInit();showMenu();});
  SFX.fanfare();say(['참 잘했어요!',R.end]);
  const w=stage.clientWidth;let n=0;
  const id=every(()=>{burst(rand(0,w),rand(0,stage.clientHeight*.4),['⭐','🌟','🎉'],4);if(++n>12)clearInterval(id);},300);
}

/* ---------- 메뉴로 (길게 누르기) ---------- */
// 🏠 누르면: 요리 메뉴에서는 놀이 선택 화면으로, 완성 화면에서는 요리 메뉴로,
// 요리 중에는 "그만할까요?" 확인 창 (5초 동안 안 누르면 닫히고 계속 진행)
const home=$('#home'),cf=$('#confirm');let cfT=null;
function closeConfirm(){cf.classList.remove('on');clearTimeout(cfT);}
function openConfirm(){
  cf.classList.add('on');clearTimeout(idleT);hideHint();speak('그만할까요?');
  clearTimeout(cfT);cfT=setTimeout(()=>{closeConfirm();resetIdle();},5000);
}
home.addEventListener('click',()=>{audioInit();
  if(!R){VOICE.stop();location.href='index.html';}
  else if(stepIdx>=R.steps.length){VOICE.stop();showMenu();}
  else openConfirm();});
$('#cfYes').addEventListener('click',()=>{closeConfirm();SFX.pop();VOICE.stop();showMenu();});
$('#cfNo').addEventListener('click',()=>{closeConfirm();SFX.good();speak(curSay);resetIdle();});

/* ---------- 첫 터치 때 소리 켜고 메뉴 안내 읽기 (아이패드는 터치 전에는 소리를 못 냄) ---------- */
let greeted=false;
document.addEventListener('pointerup',e=>{
  if(greeted)return;greeted=true;audioInit();
  if(!R&&!e.target.closest('.card'))speak(curSay);   // 첫 터치가 요리 카드면 바로 요리 안내가 나오므로 건너뜀
},true);

/* ================= 화면 고정: 확대·튕김·끌려 움직임 막기 =================
   아이패드 Safari는 user-scalable=no를 무시하므로, 두 손가락 확대·두 번 눌러 확대·화면 끌기·길게 누르기 메뉴를 코드로 막습니다.
   한 손가락 끌기는 실제로 스크롤할 내용이 있는 목록(overflow-y: auto) 안에서만 허용합니다.
   이 코드는 index.html, cooking.html, hangul.html, numbers.html, coloring.html에 똑같이 들어 있습니다. 고칠 때는 다섯 파일을 함께 고칩니다. */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  // 손가락이 닿은 곳에서 위로 올라가며, 지금 스크롤할 수 있는 목록을 찾음
  const scroller = el => {
    for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      const oy = getComputedStyle(el).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el;
    }
    return null;
  };
  let sc = null;
  document.addEventListener('touchstart', e => { sc = e.touches.length === 1 ? scroller(e.target) : null; if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !sc) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', stop);
  // 컴퓨터에서 Ctrl+휠, Ctrl +/-/0 확대 막기
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
})();

showMenu();
