<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="색칠 놀이">
<title>색칠 놀이</title>
<style>
  :root { --bg: #fff8ef; --ink: #4a3426; --card: #fff; --accent: #ff8a3d; --u: min(1vw, 1vh); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(#fff8ef, #ffe9d2); color: var(--ink); overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  button { font-family: inherit; color: var(--ink); cursor: pointer; border: none; }

  header { height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 18px; padding-top: env(safe-area-inset-top); }
  #homeBtn, #bookBtn { font-size: 30px; width: 56px; height: 56px; border-radius: 16px; background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.1); }
  #title { font-size: 30px; font-weight: 800; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #modeBtn { font-size: 20px; font-weight: 800; padding: 10px 18px; border-radius: 30px; background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.1); white-space: nowrap; }
  #homeBtn:active, #bookBtn:active, #modeBtn:active, .tbtn:active, .picard:active, .cat:active { transform: translateY(3px); box-shadow: none; }

  main { height: calc(100% - 72px - env(safe-area-inset-top)); }
  .screen { display: none; height: 100%; }
  .screen.active { display: flex; }

  /* ---------- 그림 고르기 ---------- */
  #home { flex-direction: column; align-items: center; overflow-y: auto; overflow-x: hidden; padding: 8px 18px 24px; gap: 14px; touch-action: pan-y; }
  .ask { font-size: clamp(22px, 3.2vw, 32px); font-weight: 800; }
  /* 카테고리 버튼: 가로 화면 한 줄(9개), 세로 화면 두 줄. 가로로 밀어 넘기지 않음 (화면 고정이 가로 끌기를 막음) */
  .cats { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; width: min(96vw, 1000px); padding-top: 6px; }
  @media (orientation: portrait) { .cats { grid-template-columns: repeat(5, 1fr); } }
  .cat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 8px; border-radius: 18px; background: var(--card);
    box-shadow: 0 4px 0 rgba(0,0,0,.1); font-size: clamp(12px, 1.55vw, 16px); font-weight: 800; white-space: nowrap; transition: transform .15s; }
  .cat .ic { font-size: clamp(28px, 3.6vw, 40px); line-height: 1.15; }
  .cat.on { background: linear-gradient(#ffd27a, #ffa628); color: #fff; transform: translateY(-3px) scale(1.06); box-shadow: 0 0 0 4px #fff, 0 0 0 7px #ffa628; }
  /* 그림 8장이 가로·세로 모두 4×2로 스크롤 없이 보이게 */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; width: min(96vw, 980px, max(60vw, calc((100vh - 290px) * 1.9))); }
  .picard { position: relative; background: var(--card); border-radius: 22px; padding: 8px; box-shadow: 0 6px 0 rgba(0,0,0,.1); }
  .picard svg { display: block; width: 100%; height: auto; }
  .picard .nm { font-size: clamp(15px, 2vw, 20px); font-weight: 800; text-align: center; margin-top: 2px; }
  .picard .ok { position: absolute; right: 8px; top: 6px; font-size: 26px; }

  /* ---------- 칠하기 ---------- */
  #paint { gap: 12px; padding: 6px 14px 14px; }
  #paint.land { flex-direction: row; } #paint.port { flex-direction: column; }
  #picWrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  #pic { position: relative; background: #fff; border-radius: 22px; box-shadow: 0 8px 18px rgba(80,50,20,.15); overflow: hidden; touch-action: none; }
  #pic canvas, #pic svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #pic .lines, #pic .shade, #pic .glowsvg { pointer-events: none; }
  .glow { fill: none; stroke: #ffd54a; stroke-width: 9; stroke-linejoin: round; animation: glow .7s infinite alternate; }
  @keyframes glow { from { stroke-opacity: .25; } to { stroke-opacity: 1; } }
  #side { display: flex; gap: 12px; align-items: center; justify-content: center; }
  #paint.land #side { flex-direction: column; width: 200px; }
  #paint.port #side { flex-direction: column; }
  #palette { display: grid; gap: 8px; justify-items: center; }
  #paint.land #palette { grid-template-columns: repeat(2, 1fr); }
  #paint.port #palette { grid-template-columns: repeat(6, 1fr); }
  #paint.land #palette.many { grid-template-columns: repeat(3, 1fr); }
  #paint.port #palette.many { grid-template-columns: repeat(8, 1fr); }
  /* 크레용: 아기 모드 12색은 크게, 언니·형 모드 24색은 조금 작게 */
  .crayon { --cw: 74px; position: relative; width: var(--cw); height: calc(var(--cw) * .78); background: none; padding: 0; border-radius: 14px;
    transition: transform .15s, opacity .15s; opacity: .8; }
  #palette.many .crayon { --cw: 56px; }
  .crayon svg { width: 100%; height: 100%; display: block; overflow: visible; }
  /* 고른 크레용: 흰 받침 + 진한 테두리 + 크게 + 초록 ✔ 표시 */
  .crayon.on { opacity: 1; background: #fff; box-shadow: 0 0 0 4px var(--ink), 0 6px 10px rgba(0,0,0,.25); transform: scale(1.18); z-index: 2; animation: pickc .35s; }
  .crayon.on::after { content: '✔'; position: absolute; right: -10px; top: -12px; width: 26px; height: 26px; border-radius: 50%; background: #3fb02b; color: #fff;
    font-size: 16px; font-weight: 900; line-height: 26px; text-align: center; box-shadow: 0 0 0 3px #fff; }
  @keyframes pickc { 0% { transform: scale(1); } 55% { transform: scale(1.38); } 100% { transform: scale(1.18); } }
  /* 지금 고른 색 크게 보기 */
  #curSw { width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 0 0 4px var(--ink), inset -6px -8px 0 rgba(0,0,0,.15), inset 6px 6px 0 rgba(255,255,255,.35); flex: none; }
  #curSw.pop { animation: pickc .35s; }
  #tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .tbtn { font-size: 26px; min-width: 60px; height: 60px; padding: 0 12px; border-radius: 18px; background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.1); font-weight: 900; }
  .tbtn.on { background: #ffe9b0; }
  .tbtn.size i { display: inline-block; border-radius: 50%; background: var(--ink); vertical-align: middle; }
  #doneBtn { background: linear-gradient(#7ed957, #3fb02b); color: #fff; font-size: 22px; padding: 0 18px; display: none; }
  #doneBtn.show { display: inline-block; animation: wig 1.2s ease-in-out infinite; }
  @keyframes wig { 50% { transform: rotate(-4deg) scale(1.05); } }

  /* ---------- 완성 ---------- */
  #finish { position: fixed; inset: 0; background: rgba(255,248,239,.9); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 60; }
  #finish.on { display: flex; }
  #finish img { width: min(70vw, 60vh * 4 / 3); border-radius: 22px; box-shadow: 0 10px 24px rgba(80,50,20,.25); animation: popin .5s; background: #fff; }
  #finish .t { font-size: clamp(26px, 4vw, 40px); font-weight: 900; }
  #finish .row { display: flex; gap: 18px; }
  .bigbtn { font-size: clamp(20px, 3vw, 28px); font-weight: 900; color: #fff; padding: 16px 26px; border-radius: 26px; box-shadow: 0 6px 0 rgba(0,0,0,.18); }
  .bigbtn.o { background: linear-gradient(#ffa54f, #ff7a1a); } .bigbtn.g { background: linear-gradient(#7ed957, #3fb02b); }
  @keyframes popin { from { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.05); } }

  /* ---------- 내 그림책 ---------- */
  #book { flex-direction: column; align-items: center; overflow-y: auto; overflow-x: hidden; padding: 8px 18px 24px; gap: 14px; touch-action: pan-y; }
  .bgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; width: min(96vw, 980px); }
  @media (orientation: portrait) { .bgrid { grid-template-columns: repeat(3, 1fr); } }
  .bitem { background: #fff; border-radius: 18px; padding: 6px; box-shadow: 0 5px 0 rgba(0,0,0,.1); }
  .bitem img { display: block; width: 100%; border-radius: 12px; pointer-events: none; }
  .empty { font-size: 24px; font-weight: 800; color: #9a7b62; margin-top: 40px; text-align: center; }
  #viewer { position: fixed; inset: 0; background: rgba(40,25,10,.75); display: none; align-items: center; justify-content: center; z-index: 70; }
  #viewer.on { display: flex; }
  #viewer img { max-width: 92vw; max-height: 86vh; border-radius: 22px; background: #fff; animation: popin .35s; }
  #confirm { position: fixed; inset: 0; background: rgba(40,25,10,.6); display: none; align-items: center; justify-content: center; z-index: 80; }
  #confirm.on { display: flex; }
  #confirm .box { background: #fff; border-radius: 26px; padding: 22px 26px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  #confirm .q { font-size: 26px; font-weight: 900; }
  #confirm img { width: 260px; border-radius: 14px; }

  .fx { position: fixed; pointer-events: none; font-size: 40px; animation: fly 1.1s ease-out forwards; z-index: 90; }
  @keyframes fly { 0% { transform: translate(0,0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; } }
/* ---------- 화면 고정 (다섯 파일 공통): 화면 전체가 튕기거나 끌려 움직이지 않게 고정, 글자 확대·선택·길게 누르기 메뉴 막기 ---------- */
html, body { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
* { overscroll-behavior: contain; }
img { -webkit-user-drag: none; }
</style>
<script src="voice/list.js"></script>
</head>
<body>
<header>
  <button id="homeBtn" aria-label="처음으로">🏠</button>
  <div id="title">색칠 놀이</div>
  <button id="bookBtn" aria-label="내 그림책">📖</button>
  <button id="modeBtn"></button>
</header>

<main>
  <!-- 그림 고르기 -->
  <section class="screen active" id="home">
    <div class="cats" id="catBar"></div>
    <div class="grid" id="picGrid"></div>
  </section>

  <!-- 칠하기 -->
  <section class="screen" id="paint">
    <div id="picWrap"><div id="pic"></div></div>
    <div id="side">
      <div id="palette"></div>
      <div id="tools">
        <div id="curSw" aria-hidden="true"></div>
        <button class="tbtn size" id="sizeBig" aria-label="굵은 붓"><i style="width:26px;height:26px"></i></button>
        <button class="tbtn size" id="sizeSmall" aria-label="가는 붓"><i style="width:12px;height:12px"></i></button>
        <button class="tbtn" id="resetBtn" aria-label="처음부터">🔄</button>
        <button class="tbtn" id="doneBtn">✅ 다 칠했어요</button>
      </div>
    </div>
  </section>

  <!-- 내 그림책 -->
  <section class="screen" id="book">
    <div class="ask">내 그림책</div>
    <div class="bgrid" id="bookGrid"></div>
  </section>
</main>

<div id="finish">
  <div class="t">다 칠했어요!</div>
  <img id="finishImg" alt="">
  <div class="row"><button class="bigbtn o" id="moreBtn">🖍️ 다른 그림</button><button class="bigbtn g" id="toBookBtn">📖 그림책</button></div>
</div>
<div id="viewer"><img id="viewImg" alt=""></div>
<div id="confirm"><div class="box"><div class="q">이 그림을 지울까요?</div><img id="confirmImg" alt="">
  <div class="row" style="display:flex;gap:18px"><button class="bigbtn o" id="delYes">⭕ 지우기</button><button class="bigbtn g" id="delNo">❌ 그대로</button></div></div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const hasBatchim = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c % 28 !== 0; };
const eul = w => w + (hasBatchim(w) ? '을' : '를');

/* ================= 음성 재생 (mp3 우선, 없으면 기기 음성) =================
   voice/list.js의 VOICE_FILES에 있는 문장은 voice/<이름>.mp3를 재생하고, 없으면 기기 음성(Web Speech API)으로 읽습니다.
   문장 배열을 주면 조각 mp3를 차례로 이어서 재생합니다. 한 조각이라도 mp3가 없으면 전체를 기기 음성으로 읽습니다.
   mp3 이름은 문장의 FNV-1a 해시(16진수 8자리)입니다. tools/voice-lines.html도 같은 방식으로 이름을 만듭니다.
   이 코드는 index.html, cooking.html, hangul.html, numbers.html, coloring.html에 똑같이 들어 있습니다. 고칠 때는 다섯 파일을 함께 고칩니다. */
const VOICE = (() => {
  const norm = t => String(t).trim().replace(/\s+/g, ' ');
  const hash = t => { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
  const heard = new Set();   // 지금까지 읽은 문장 (문장 목록 점검용)
  const bufs = {};
  let ctx = null, src = null, token = 0;
  function unlock() {        // 아이패드는 터치 안에서 소리 장치를 켜야 그 뒤에 소리가 납니다
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { /* 소리 장치 없음 */ }
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlock, true));
  function load(h) {
    return bufs[h] = bufs[h] || fetch(`voice/${h}.mp3`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no)))
      .catch(e => { delete bufs[h]; throw e; });
  }
  function stop() {
    token++;
    if (src) { try { src.onended = null; src.stop(); } catch (e) {} src = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  // parts: 문장 하나 또는 문장 배열, tts(전체 문장): 기기 음성으로 읽는 함수, onend: mp3를 다 재생한 뒤 부를 함수
  function play(parts, tts, onend) {
    stop();
    const list = [].concat(parts).filter(Boolean).map(norm).filter(Boolean);
    if (!list.length) return;
    list.forEach(t => heard.add(t));
    const files = window.VOICE_FILES || {}, hs = list.map(hash);
    unlock();
    if (!ctx || !hs.every((h, i) => files[h] === list[i])) { tts(list.join(' ')); return; }
    const my = token;
    Promise.all(hs.map(load)).then(bs => {
      let i = 0;
      const next = () => {
        if (my !== token) return;
        if (i >= bs.length) { src = null; if (onend) onend(); return; }
        src = ctx.createBufferSource(); src.buffer = bs[i++]; src.connect(ctx.destination);
        src.onended = next; src.start();
      };
      next();
    }).catch(() => { if (my === token) tts(list.join(' ')); });
  }
  return { play, stop, heard, hash, norm };
})();

let koVoice = null;
function pickVoice() { const vs = speechSynthesis.getVoices(); koVoice = vs.find(v => /^ko/i.test(v.lang)) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function ttsSpeak(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = .9; u.pitch = 1.2;
  speechSynthesis.speak(u);
}
// text: 문장 하나 또는 이어 읽을 문장 배열
function speak(text) { VOICE.play(text, ttsSpeak); }

/* ---------- 효과음 ---------- */
let AC = null;
function tone(freqs, type = 'sine') {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    freqs.forEach((f, i) => {
      const t = AC.currentTime + i * 0.08, o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}
const fillTone = () => tone([520 + Math.random() * 200, 880]), goodTone = () => tone([660, 880, 1100, 1320]);
function celebrate(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 12; i++) {
    const f = document.createElement('div'); f.className = 'fx'; f.textContent = pick(['⭐', '✨', '🎉', '💖']);
    f.style.left = r.left + r.width / 2 - 20 + 'px'; f.style.top = r.top + r.height / 2 - 20 + 'px';
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 140;
    f.style.setProperty('--dx', Math.cos(a) * d + 'px'); f.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
  }
}
const PRAISE = ['잘했어요!', '예뻐요!', '최고예요!', '멋져요!'];

/* ================= 그림 =================
   그림판 크기 400×300. regions: 칠할 수 있는 칸(뒤에 있는 칸부터 앞에 있는 칸 순서). 앞 칸이 뒤 칸을 가립니다.
   details: 칸 위에 그리는 눈·입 같은 선과 점 (칠하지 않음). {d, fill} 은 채운 점, {d} 는 선.
   새 그림을 넣을 때는 .claude/skills/svg-3d-style 의 "색칠 그림" 규칙을 따릅니다. */
const E = (cx, cy, rx, ry) => `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${rx * 2} 0a${rx} ${ry} 0 1 0 ${-rx * 2} 0Z`;   // 타원
const EYE = (x, y, r = 7) => [{ d: E(x, y, r, r), fill: '#3a2a20' }, { d: E(x - r * .35, y - r * .4, r * .35, r * .35), fill: '#fff' }];
// 아래 도우미는 절대 좌표 "x y" 쌍만 쓰는 경로(M L Q C Z)에만 씁니다. E()로 만든 타원에는 MX·TX를 쓰지 않습니다.
const ER = (cx, cy, rx, ry) => `M${cx - rx} ${cy}a${rx} ${ry} 0 1 1 ${rx * 2} 0a${rx} ${ry} 0 1 1 ${-rx * 2} 0Z`;   // 거꾸로 도는 타원: E()에 이어 붙이면 구멍
const RR = (x, y, w, h, r) => `M${x + r} ${y}L${x + w - r} ${y}Q${x + w} ${y} ${x + w} ${y + r}L${x + w} ${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}L${x + r} ${y + h}Q${x} ${y + h} ${x} ${y + h - r}L${x} ${y + r}Q${x} ${y} ${x + r} ${y}Z`; // 둥근 네모
const PAIR = /(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g;
const MX = d => d.replace(PAIR, (m, x, y) => `${400 - x} ${y}`);                        // 좌우 뒤집기 (그림판 가운데 기준)
const TX = (d, dx, dy = 0) => d.replace(PAIR, (m, x, y) => `${+x + dx} ${+y + dy}`);    // 옮기기
const f1 = v => +v.toFixed(1);
const STAR = (cx, cy, ro, ri, n = 5) => Array.from({ length: n * 2 }, (_, k) => { const r = k % 2 ? ri : ro, a = -Math.PI / 2 + k * Math.PI / n; return `${k ? 'L' : 'M'}${f1(cx + r * Math.cos(a))} ${f1(cy + r * Math.sin(a))}`; }).join('') + 'Z';
const PETAL = (cx, cy, deg, r0, r1, w) => {   // 꽃잎·날개 모양 (deg 방향으로 r0에서 r1까지)
  const c = Math.cos(deg * Math.PI / 180), s = Math.sin(deg * Math.PI / 180), p = (t, o) => `${f1(cx + c * t - s * o)} ${f1(cy + s * t + c * o)}`;

// 색을 밝게/어둡게 (크레용 입체감용)
function shadeHex(hex, k) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
// 크레용 그림: 왼쪽 위 빛, 3단 그라데이션, 종이띠 (그림체 규칙)
function crayonSVG(hex, i) {
  const l = shadeHex(hex, .45), d = shadeHex(hex, -.3), id = 'cr' + i;
  return `<svg viewBox="0 0 100 78"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${l}"/><stop offset=".5" stop-color="${hex}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs>
    <ellipse cx="50" cy="72" rx="38" ry="4" fill="rgba(0,0,0,.15)"/>
    <path d="M8 26 Q8 18 16 18 L70 18 L96 39 L70 60 L16 60 Q8 60 8 52Z" fill="url(#${id})"/>
    <rect x="22" y="18" width="30" height="42" fill="#fff" opacity=".85"/>
    <rect x="22" y="18" width="30" height="42" fill="url(#${id})" opacity=".25"/>
    <path d="M14 24 L64 24" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/></svg>`;
}

/* ================= 칠하기 엔진 =================
   칠한 색은 canvas(paint)에, 칸마다의 빛·그늘은 shade, 테두리 선은 lines에 그립니다 (모두 1600×1200, 화면에서는 CSS로 줄여 보임).
   칸 하나를 칠할 때는 그 칸 안쪽이면서 앞에 있는 칸들 바깥으로만 칠해지게 자릅니다(clip). */
const VW = 400, VH = 300, K = 4;
let pic = null, paths = [], minus = [], boxes = [], painted = new Set(), stroked = false;
let cvPaint, cvShade, cvLines, glowSvg;
const pctx = () => cvPaint.getContext('2d');
const RECT = (() => { const p = new Path2D(); p.rect(-20, -20, VW + 40, VH + 40); return p; })();
function makeCanvas(cls) { const c = document.createElement('canvas'); c.width = VW * K; c.height = VH * K; c.className = cls; return c; }
// 칸 i의 보이는 부분으로 자르기: 칸 i 안 ∩ (앞 칸들 바깥)
function clipRegion(ctx, i) {
  ctx.clip(paths[i]);
  for (let j = i + 1; j < paths.length; j++) ctx.clip(minus[j], 'evenodd');
}
function bboxOf(d) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'), p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  s.setAttribute('style', 'position:absolute;width:0;height:0;visibility:hidden'); p.setAttribute('d', d); s.appendChild(p); document.body.appendChild(s);
  const b = p.getBBox(); s.remove(); return b;
}
function drawLines() {
  const ctx = cvLines.getContext('2d'); ctx.setTransform(K, 0, 0, K, 0, 0); ctx.clearRect(0, 0, VW, VH);
  ctx.lineJoin = ctx.lineCap = 'round'; ctx.strokeStyle = '#4a3426';
  paths.forEach(p => {   // 뒤 칸 선은 앞 칸이 가림
    ctx.globalCompositeOperation = 'destination-out'; ctx.fill(p);
    ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = 4.2; ctx.stroke(p);
  });
  pic.details.forEach(dt => { const p = new Path2D(dt.d); if (dt.fill) { ctx.fillStyle = dt.fill; ctx.fill(p); } else { ctx.lineWidth = 3.4; ctx.stroke(p); } });
}
// 칸 i에 빛(왼쪽 위)과 그늘(오른쪽 아래)을 한 번 그림
function drawShade(i) {
  const ctx = cvShade.getContext('2d'), b = boxes[i];
  ctx.save(); ctx.setTransform(K, 0, 0, K, 0, 0); clipRegion(ctx, i);
  const g = ctx.createRadialGradient(b.x + b.width * .35, b.y + b.height * .3, 0, b.x + b.width * .35, b.y + b.height * .3, Math.max(b.width, b.height) * .85);
  g.addColorStop(0, 'rgba(255,255,255,.4)'); g.addColorStop(.35, 'rgba(255,255,255,0)'); g.addColorStop(.75, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(60,30,0,.16)');
  ctx.fillStyle = g; ctx.fillRect(b.x - 2, b.y - 2, b.width + 4, b.height + 4); ctx.restore();
}
function regionAt(vx, vy) {
  const ctx = cvShade.getContext('2d'); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = paths.length - 1; i >= 0; i--) if (ctx.isPointInPath(paths[i], vx, vy)) { ctx.restore(); return i; }
  ctx.restore(); return -1;
}
function fillRegion(i, color) {
  const ctx = pctx(); ctx.save(); ctx.setTransform(K, 0, 0, K, 0, 0); clipRegion(ctx, i);
  ctx.fillStyle = color; ctx.fillRect(-20, -20, VW + 40, VH + 40); ctx.restore();
  if (!painted.has(i)) { painted.add(i); drawShade(i); }
}
function openPic(p) {
  pic = p; paths = p.regions.map(d => new Path2D(d)); boxes = p.regions.map(bboxOf);
  minus = paths.map(pp => { const m = new Path2D(); m.addPath(RECT); m.addPath(pp); return m; });
  painted = new Set(); stroked = false;
  const box = $('pic'); box.innerHTML = '';
  cvPaint = makeCanvas('paint'); cvShade = makeCanvas('shade'); cvLines = makeCanvas('lines');
  glowSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); glowSvg.setAttribute('viewBox', `0 0 ${VW} ${VH}`); glowSvg.classList.add('glowsvg');
  box.append(cvPaint, cvShade, cvLines, glowSvg);
  drawLines(); layout();
  $('doneBtn').classList.remove('show');
}

/* ---------- 터치: 아기 모드는 톡 채우기, 언니·형 모드는 문질러 칠하기 ---------- */
let drawing = null;   // { region, last:{x,y} }
const toV = e => { const r = $('pic').getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; };
function strokeSeg(i, a, b) {
  const ctx = pctx(); ctx.save(); ctx.setTransform(K, 0, 0, K, 0, 0); clipRegion(ctx, i);
  ctx.strokeStyle = ctx.fillStyle = curColor; ctx.lineWidth = brush; ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x + .01, b.y); ctx.stroke(); ctx.restore();
}
function onDown(e) {
  if (!pic) return;
  const v = toV(e), i = regionAt(v.x, v.y); clearGlow();
  if (i < 0) return;
  if (babyMode) {
    fillRegion(i, curColor); fillTone();
    if (painted.size === paths.length) setTimeout(finishPic, 500);
    return;
  }
  drawing = { region: i, last: v, id: e.pointerId };
  try { $('pic').setPointerCapture(e.pointerId); } catch (err) {}
  strokeSeg(i, v, v);
  if (!painted.has(i)) { painted.add(i); drawShade(i); }
  if (!stroked) { stroked = true; $('doneBtn').classList.add('show'); }
}
function onMove(e) {
  if (!drawing || e.pointerId !== drawing.id) return;
  const co = e.getCoalescedEvents ? e.getCoalescedEvents() : [], evs = co.length ? co : [e];   // 합쳐진 움직임이 없으면 이번 움직임만
  for (const ev of evs) { const v = toV(ev); strokeSeg(drawing.region, drawing.last, v); drawing.last = v; }
}
function onUp(e) { if (drawing && e.pointerId === drawing.id) drawing = null; }

/* ---------- 화면 배치: 가로는 오른쪽에 색, 세로는 아래에 색. 그림은 4:3로 꽉 차게 ---------- */
function layout() {
  const P = $('paint'), land = innerWidth > innerHeight;
  P.classList.toggle('land', land); P.classList.toggle('port', !land);
  const w = $('picWrap').clientWidth, h = $('picWrap').clientHeight; if (!w || !h) return;
  const s = Math.min(w / VW, h / VH); $('pic').style.width = VW * s + 'px'; $('pic').style.height = VH * s + 'px';
}
addEventListener('resize', () => { if ($('paint').classList.contains('active')) layout(); });

function renderPalette() {
  const box = $('palette'); box.innerHTML = ''; box.classList.toggle('many', !babyMode);
  colorsNow().forEach(([name, hex], i) => {
    const b = document.createElement('button'); b.className = 'crayon' + (hex === curColor ? ' on' : ''); b.innerHTML = crayonSVG(hex, i); b.setAttribute('aria-label', name);
    b.onclick = () => { curColor = hex; box.querySelectorAll('.crayon').forEach(x => x.classList.toggle('on', x === b)); showCur(true); tone([700]); speak(name); };
    box.appendChild(b);
  });
  const big = !babyMode;
  $('sizeBig').style.display = $('sizeSmall').style.display = big ? '' : 'none';
  $('sizeBig').classList.toggle('on', brush === 16); $('sizeSmall').classList.toggle('on', brush === 7);
  showCur(false);
}
// 지금 고른 색을 큰 동그라미와 붓 굵기 점에 보여 줌
function showCur(pop) {
  const sw = $('curSw'); sw.style.background = curColor;
  document.querySelectorAll('.tbtn.size i').forEach(i => { i.style.background = curColor; i.style.boxShadow = '0 0 0 2px var(--ink)'; });
  if (pop) { sw.classList.remove('pop'); void sw.offsetWidth; sw.classList.add('pop'); }
}
$('sizeBig').onclick = () => { brush = 16; renderPalette(); tone([500]); };
$('sizeSmall').onclick = () => { brush = 7; renderPalette(); tone([800]); };
$('resetBtn').onclick = () => { openPic(pic); speak('처음부터 다시 칠해요!'); };
$('doneBtn').onclick = () => finishPic();

/* ================= 완성, 그림책 ================= */
const loadBook = () => { try { return JSON.parse(localStorage.getItem('color-book') || '[]'); } catch (e) { return []; } };
const saveBook = b => { try { localStorage.setItem('color-book', JSON.stringify(b)); return true; } catch (e) { return false; } };
const doneSet = () => { try { return new Set(JSON.parse(localStorage.getItem('color-done') || '[]')); } catch (e) { return new Set(); } };
function snapshot(w = 480) {
  const c = document.createElement('canvas'); c.width = w; c.height = w * VH / VW; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  [cvPaint, cvShade, cvLines].forEach(cv => x.drawImage(cv, 0, 0, c.width, c.height));
  return c.toDataURL('image/jpeg', .85);
}
function finishPic() {
  if (!pic || $('finish').classList.contains('on')) return;
  const img = snapshot();
  let book = loadBook(); book.unshift({ id: pic.id, img, t: Date.now() }); book = book.slice(0, 30);
  while (!saveBook(book) && book.length > 1) book.pop();   // 저장 공간이 모자라면 오래된 그림부터 덜어냄
  const ds = doneSet(); ds.add(pic.id); try { localStorage.setItem('color-done', JSON.stringify([...ds])); } catch (e) {}
  $('finishImg').src = img; $('finish').classList.add('on');
  goodTone(); celebrate($('finishImg')); speak(['다 칠했어요! 그림책에 넣었어요!', pick(PRAISE)]);
}
$('moreBtn').onclick = () => { $('finish').classList.remove('on'); show('home'); };
$('toBookBtn').onclick = () => { $('finish').classList.remove('on'); show('book'); };

function renderBook() {
  const g = $('bookGrid'), book = loadBook(); g.innerHTML = '';
  if (!book.length) { g.innerHTML = '<div class="empty" style="grid-column:1/-1">아직 그림이 없어요.<br>그림을 칠해 봐요!</div>'; speak('아직 그림이 없어요. 그림을 칠해 봐요!'); return; }
  book.forEach((it, idx) => {
    const d = document.createElement('div'); d.className = 'bitem'; d.innerHTML = `<img src="${it.img}" alt="">`;
    let lt = null, longed = false;
    d.addEventListener('pointerdown', () => { longed = false; lt = setTimeout(() => { longed = true; askDelete(idx); }, 800); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => d.addEventListener(t, () => clearTimeout(lt)));
    d.addEventListener('click', () => { if (longed) return; $('viewImg').src = it.img; $('viewer').classList.add('on'); tone([660, 990]); });
    g.appendChild(d);
  });
  speak('내 그림책');
}
$('viewer').onclick = () => $('viewer').classList.remove('on');
let delIdx = -1;
function askDelete(idx) { delIdx = idx; $('confirmImg').src = loadBook()[idx].img; $('confirm').classList.add('on'); speak('이 그림을 지울까요?'); }
$('delYes').onclick = () => { const b = loadBook(); b.splice(delIdx, 1); saveBook(b); $('confirm').classList.remove('on'); renderBook(); };
$('delNo').onclick = () => $('confirm').classList.remove('on');

/* ================= 그림 고르기 화면 ================= */
function thumbSVG(p) {   // 선만 있는 작은 그림 (앞 칸이 뒤 칸 선을 가리도록 흰색으로 채워 그림)
  return `<svg viewBox="0 0 ${VW} ${VH}"><g fill="#fff" stroke="#4a3426" stroke-width="5" stroke-linejoin="round">${p.regions.map(d => `<path d="${d}"/>`).join('')}</g>
    ${p.details.map(dt => dt.fill ? `<path d="${dt.d}" fill="${dt.fill}"/>` : `<path d="${dt.d}" fill="none" stroke="#4a3426" stroke-width="4" stroke-linecap="round"/>`).join('')}</svg>`;
}
// 카테고리: [id, 화면 이름, 이모지, 읽는 말]. 그림의 cat 값이 id
const CATS = [
  ['animal', '동물', '🐶', '동물'], ['sea', '바다 친구', '🐠', '바다 친구'], ['dino', '공룡', '🦖', '공룡'],
  ['ride', '탈것', '🚗', '탈것'], ['food', '음식', '🍰', '음식'], ['nature', '자연·날씨', '🌈', '자연과 날씨'],
  ['bug', '곤충', '🐞', '곤충'], ['toy', '장난감·놀이', '🧸', '장난감 놀이'], ['space', '공주·우주', '👑', '공주와 우주'],
];
let curCat = 'animal';
try { const c = localStorage.getItem('color-cat'); if (CATS.some(k => k[0] === c)) curCat = c; } catch (e) {}
function renderHome() {
  const bar = $('catBar'); bar.innerHTML = '';
  CATS.forEach(([id, name, ic, say]) => {
    const b = document.createElement('button'); b.className = 'cat' + (id === curCat ? ' on' : '');
    b.innerHTML = `<div class="ic">${ic}</div>${name}`;
    b.onclick = () => { if (id === curCat) { speak(say); return; } curCat = id; try { localStorage.setItem('color-cat', id); } catch (e) {} renderHome(); tone([600, 800]); speak(say); };
    bar.appendChild(b);
  });
  const g = $('picGrid'), ds = doneSet(); g.innerHTML = '';
  PICS.filter(p => p.cat === curCat).forEach(p => {
    const b = document.createElement('button'); b.className = 'picard';
    b.innerHTML = thumbSVG(p) + `<div class="nm">${p.name}</div>` + (ds.has(p.id) ? '<div class="ok">⭐</div>' : '');
    b.onclick = () => { tone([600, 900]); startPic(p); };
    g.appendChild(b);
  });
}
function startPic(p) {
  pic = p; show('paint'); openPic(p); renderPalette();
  speak([`${eul(p.name)} 칠해 볼까요?`, babyMode ? '색을 고르고, 칸을 톡 눌러서 칠해요!' : '색을 고르고, 손가락으로 쓱쓱 칠해요!']);
}

/* ================= 반응이 없을 때 안내 ================= */
// 칠하기 화면에서 8초 동안 아무것도 누르지 않으면 안내를 읽고, 아기 모드는 안 칠한 칸을 반짝이게 합니다. 그 뒤 12초마다 반복
let idleT = null;
function clearGlow() { if (glowSvg) glowSvg.innerHTML = ''; }
function resetIdle() {
  clearTimeout(idleT); clearGlow();
  if (!$('paint').classList.contains('active') || $('finish').classList.contains('on')) return;
  const fire = () => {
    if (babyMode) {
      const i = paths.findIndex((_, k) => !painted.has(k));
      if (i >= 0) { glowSvg.innerHTML = `<path class="glow" d="${pic.regions[i]}"/>`; speak('아직 안 칠한 칸이 있어요!'); }
    } else speak(stroked ? '다 칠했으면 초록 버튼을 눌러요!' : '색을 고르고 쓱쓱 칠해 봐요!');
    idleT = setTimeout(fire, 12000);
  };
  idleT = setTimeout(fire, 8000);
}
document.addEventListener('pointerdown', resetIdle, true);

/* ================= 화면 전환, 모드 ================= */
const TITLES = { home: '색칠 놀이', paint: '색칠 놀이', book: '내 그림책' };
function show(id) {
  VOICE.stop();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  $('title').textContent = id === 'paint' && pic ? pic.name : TITLES[id];
  if (id === 'home') { renderHome(); speak('그리고 싶은 그림을 골라요!'); }
  if (id === 'book') renderBook();
  if (id === 'paint') requestAnimationFrame(layout);
  resetIdle();
}
function applyMode() { $('modeBtn').textContent = babyMode ? '👶 아기 모드' : '🧒 언니·형 모드'; if (!colorsNow().some(c => c[1] === curColor)) curColor = COLORS[0][1]; }
$('modeBtn').onclick = () => {
  babyMode = !babyMode; try { localStorage.setItem('color-mode', babyMode ? 'baby' : 'big'); } catch (e) {}
  applyMode(); speak(babyMode ? '아기 모드' : '언니 형 모드');
  if ($('paint').classList.contains('active')) { openPic(pic); renderPalette(); }
};
// 🏠: 칠하기·그림책에서는 그림 고르기로, 그림 고르기에서는 놀이 선택 화면으로
$('homeBtn').onclick = () => { if ($('home').classList.contains('active')) location.href = 'index.html'; else { $('finish').classList.remove('on'); show('home'); } };
$('bookBtn').onclick = () => { $('finish').classList.remove('on'); tone([600, 900]); show('book'); };

const picEl = $('pic');
picEl.addEventListener('pointerdown', onDown);
picEl.addEventListener('pointermove', onMove);
['pointerup', 'pointercancel'].forEach(t => picEl.addEventListener(t, onUp));

/* ================= 음성 문장 목록 ================= */
// 이 놀이에서 읽을 수 있는 문장을 모두 돌려줍니다. tools/voice-lines.html이 이 목록으로 mp3 문장표를 만듭니다.
// speak()에 새 문장을 넣으면 여기에도 꼭 추가합니다.
function voiceLines() {
  return ['그리고 싶은 그림을 골라요!', '색을 고르고, 칸을 톡 눌러서 칠해요!', '색을 고르고, 손가락으로 쓱쓱 칠해요!', '처음부터 다시 칠해요!',
    '다 칠했어요! 그림책에 넣었어요!', '아직 안 칠한 칸이 있어요!', '다 칠했으면 초록 버튼을 눌러요!', '색을 고르고 쓱쓱 칠해 봐요!',
    '아직 그림이 없어요. 그림을 칠해 봐요!', '내 그림책', '이 그림을 지울까요?', '아기 모드', '언니 형 모드', ...CATS.map(c => c[3]),
    ...PRAISE, ...COLORS.map(c => c[0]), ...PICS.map(p => `${eul(p.name)} 칠해 볼까요?`)];
}

/* ================= 화면 고정: 확대·튕김·끌려 움직임 막기 =================
   아이패드 Safari는 user-scalable=no를 무시하므로, 두 손가락 확대·두 번 눌러 확대·화면 끌기·길게 누르기 메뉴를 코드로 막습니다.
   한 손가락 끌기는 실제로 스크롤할 내용이 있는 목록(overflow-y: auto) 안에서만 허용합니다.
   이 코드는 index.html, cooking.html, hangul.html, numbers.html, coloring.html에 똑같이 들어 있습니다. 고칠 때는 다섯 파일을 함께 고칩니다. */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  // 손가락이 닿은 곳에서 위로 올라가며, 지금 스크롤할 수 있는 목록을 찾음
  const scroller = el => {
    for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      const oy = getComputedStyle(el).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el;
    }
    return null;
  };
  let sc = null;
  document.addEventListener('touchstart', e => { sc = e.touches.length === 1 ? scroller(e.target) : null; if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !sc) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', stop);
  // 컴퓨터에서 Ctrl+휠, Ctrl +/-/0 확대 막기
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
})();

applyMode(); renderHome();
let greeted = false;   // 아이패드는 터치 전에는 소리를 못 내므로 첫 터치 때 안내
document.addEventListener('pointerup', e => { if (greeted) return; greeted = true; if ($('home').classList.contains('active') && !e.target.closest('.picard')) speak('그리고 싶은 그림을 골라요!'); }, true);
</script>
</body>
