<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="놀이터">
<title>우리 놀이터</title>
<style>
:root{--u:min(1vw,1vh);--ink:#6b3e1e;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
  background:linear-gradient(#fff6e0,#ffe0bd);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
h1{margin:0;font-size:calc(var(--u)*8);font-weight:900;text-align:center;}
.cards{display:flex;flex-wrap:wrap;gap:calc(var(--u)*6);justify-content:center;}
.card{width:calc(var(--u)*40);height:calc(var(--u)*44);border-radius:calc(var(--u)*6);text-decoration:none;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);
  font-size:calc(var(--u)*6);font-weight:900;box-shadow:0 calc(var(--u)*1.5) 0 rgba(0,0,0,.18);transition:transform .1s;}
.card .ic{font-size:calc(var(--u)*20);line-height:1;animation:bob 2s ease-in-out infinite;}
.card:nth-child(2) .ic{animation-delay:-1s;}
.card:active{transform:translateY(calc(var(--u)*1.2));box-shadow:none;}
.cook{background:linear-gradient(#ffa54f,#ff7a1a);}
.hangul{background:linear-gradient(#7fb4ff,#4d8ef0);}
.hangul .ic{font-weight:900;font-size:calc(var(--u)*18);text-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.15);}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-2)) rotate(-4deg)}}
</style>
</head>
<body>
<h1>무엇을 하고 놀까요?</h1>
<div class="cards">
  <a class="card cook" href="cooking.html" data-say="요리 놀이"><div class="ic">🍳</div>요리 놀이</a>
  <a class="card hangul" href="hangul.html" data-say="한글 놀이터"><div class="ic">가</div>한글 놀이터</a>
</div>
<script>
/* 카드를 누르면 이름을 읽어 준 뒤 이동합니다 */
document.querySelectorAll('.card').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  let moved=false;const go=()=>{if(!moved){moved=true;location.href=a.getAttribute('href');}};
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(a.dataset.say);u.lang='ko-KR';u.rate=.95;u.pitch=1.25;
    u.onend=go;speechSynthesis.speak(u);setTimeout(go,1500);
  }else go();
}));
/* 확대·길게 누르기 메뉴 막기 */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
