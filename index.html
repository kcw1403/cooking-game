<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="놀이터">
<title>우리 놀이터</title>
<style>
:root{--u:min(1vw,1vh);--ink:#6b3e1e;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
  background:linear-gradient(#fff6e0,#ffe0bd);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
h1{margin:0;font-size:calc(var(--u)*8);font-weight:900;text-align:center;}
.cards{display:flex;flex-wrap:wrap;gap:calc(var(--u)*5);justify-content:center;max-width:calc(var(--u)*110);}
.card{width:calc(var(--u)*30);height:calc(var(--u)*38);border-radius:calc(var(--u)*5);text-decoration:none;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);
  font-size:calc(var(--u)*5);font-weight:900;box-shadow:0 calc(var(--u)*1.5) 0 rgba(0,0,0,.18);transition:transform .1s;}
.card .ic{font-size:calc(var(--u)*16);line-height:1;animation:bob 2s ease-in-out infinite;}
.card:nth-child(2) .ic{animation-delay:-.7s;}
.card:nth-child(3) .ic{animation-delay:-1.4s;}
@media (orientation:portrait){.cards{max-width:calc(var(--u)*80);}.card{width:calc(var(--u)*36);height:calc(var(--u)*42);}}
.card:active{transform:translateY(calc(var(--u)*1.2));box-shadow:none;}
.cook{background:linear-gradient(#ffa54f,#ff7a1a);}
.hangul{background:linear-gradient(#7fb4ff,#4d8ef0);}
.numbers{background:linear-gradient(#6fd3a3,#33a978);}
.numbers .ic{font-weight:900;font-size:calc(var(--u)*13);text-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.15);letter-spacing:calc(var(--u)*-.5);}
.hangul .ic{font-weight:900;font-size:calc(var(--u)*15);text-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.15);}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-2)) rotate(-4deg)}}
</style>
<script src="voice/list.js"></script>
</head>
<body>
<h1>무엇을 하고 놀까요?</h1>
<div class="cards">
  <a class="card cook" href="cooking.html" data-say="요리 놀이"><div class="ic">🍳</div>요리 놀이</a>
  <a class="card hangul" href="hangul.html" data-say="한글 놀이터"><div class="ic">가</div>한글 놀이터</a>
  <a class="card numbers" href="numbers.html" data-say="숫자 놀이"><div class="ic">123</div>숫자 놀이</a>
</div>
<script>
/* ================= 음성 재생 (mp3 우선, 없으면 기기 음성) =================
   voice/list.js의 VOICE_FILES에 있는 문장은 voice/<이름>.mp3를 재생하고, 없으면 기기 음성(Web Speech API)으로 읽습니다.
   문장 배열을 주면 조각 mp3를 차례로 이어서 재생합니다. 한 조각이라도 mp3가 없으면 전체를 기기 음성으로 읽습니다.
   mp3 이름은 문장의 FNV-1a 해시(16진수 8자리)입니다. tools/voice-lines.html도 같은 방식으로 이름을 만듭니다.
   이 코드는 index.html, cooking.html, hangul.html, numbers.html에 똑같이 들어 있습니다. 고칠 때는 네 파일을 함께 고칩니다. */
const VOICE = (() => {
  const norm = t => String(t).trim().replace(/\s+/g, ' ');
  const hash = t => { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
  const heard = new Set();   // 지금까지 읽은 문장 (문장 목록 점검용)
  const bufs = {};
  let ctx = null, src = null, token = 0;
  function unlock() {        // 아이패드는 터치 안에서 소리 장치를 켜야 그 뒤에 소리가 납니다
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { /* 소리 장치 없음 */ }
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlock, true));
  function load(h) {
    return bufs[h] = bufs[h] || fetch(`voice/${h}.mp3`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no)))
      .catch(e => { delete bufs[h]; throw e; });
  }
  function stop() {
    token++;
    if (src) { try { src.onended = null; src.stop(); } catch (e) {} src = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  // parts: 문장 하나 또는 문장 배열, tts(전체 문장): 기기 음성으로 읽는 함수, onend: mp3를 다 재생한 뒤 부를 함수
  function play(parts, tts, onend) {
    stop();
    const list = [].concat(parts).filter(Boolean).map(norm).filter(Boolean);
    if (!list.length) return;
    list.forEach(t => heard.add(t));
    const files = window.VOICE_FILES || {}, hs = list.map(hash);
    unlock();
    if (!ctx || !hs.every((h, i) => files[h] === list[i])) { tts(list.join(' ')); return; }
    const my = token;
    Promise.all(hs.map(load)).then(bs => {
      let i = 0;
      const next = () => {
        if (my !== token) return;
        if (i >= bs.length) { src = null; if (onend) onend(); return; }
        src = ctx.createBufferSource(); src.buffer = bs[i++]; src.connect(ctx.destination);
        src.onended = next; src.start();
      };
      next();
    }).catch(() => { if (my === token) tts(list.join(' ')); });
  }
  return { play, stop, heard, hash, norm };
})();

/* 음성 문장 목록: tools/voice-lines.html이 이 목록으로 mp3 문장표를 만듭니다 */
function voiceLines(){return [...document.querySelectorAll('.card')].map(a=>a.dataset.say);}

/* 카드를 누르면 이름을 읽어 준 뒤 이동합니다 (다 읽거나 1.5초가 지나면 이동) */
document.querySelectorAll('.card').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  let moved=false;const go=()=>{if(!moved){moved=true;location.href=a.getAttribute('href');}};
  VOICE.play(a.dataset.say,t=>{
    if(!('speechSynthesis' in window)){go();return;}
    const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.95;u.pitch=1.25;
    u.onend=go;speechSynthesis.speak(u);
  },go);
  setTimeout(go,1500);
}));
/* 확대·길게 누르기 메뉴 막기 */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
