<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글놀이">
<title>한글 놀이터</title>
<style>
  :root {
    --bg: #fff8ec; --ink: #3a2e2a; --muted: #9a8b80;
    --c1: #ff7f6e; --c2: #3dbb93; --c3: #5b9dff; --c4: #ffb340;
    --cons: #ffe2dc; --vow: #dcecff; --card: #ffffff;
    --k: min(11vw, 10vh, 110px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  button { font-family: inherit; color: var(--ink); cursor: pointer; }

  header {
    height: 72px; display: flex; align-items: center; gap: 12px;
    padding: 0 18px; padding-top: env(safe-area-inset-top);
  }
  #homeBtn {
    font-size: 30px; width: 56px; height: 56px; border: none; border-radius: 16px;
    background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.1); visibility: hidden;
  }
  #title { font-size: 30px; font-weight: 800; flex: 1; }
  #starBox { font-size: 26px; font-weight: 800; background: var(--card); padding: 8px 16px; border-radius: 30px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }

  main { height: calc(100% - 72px - env(safe-area-inset-top)); }
  .screen {
    display: none; height: 100%; padding: 8px 20px 20px;
    flex-direction: column; align-items: center; gap: 14px; overflow-y: auto;
  }
  .screen.active { display: flex; }

  /* ---------- 홈 ---------- */
  .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; width: min(92vw, 820px); margin: auto 0; }
  .menu button {
    border: none; border-radius: 32px; padding: 28px 10px; min-height: min(32vh, 260px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    font-size: clamp(22px, 3.6vw, 36px); font-weight: 800; color: #fff;
    box-shadow: 0 8px 0 rgba(0,0,0,.15);
  }
  .menu button span { font-size: clamp(50px, 9vw, 96px); }
  .menu button:active, .key:active, .opt:active, .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #voiceTip { display: none; font-size: 18px; color: #b0553f; background: #ffe9e3; padding: 10px 16px; border-radius: 14px; text-align: center; }

  /* ---------- 공통 ---------- */
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tab {
    border: none; border-radius: 30px; padding: 10px 22px; font-size: 22px; font-weight: 800;
    background: #efe3d3; color: var(--muted);
  }
  .tab.on { background: var(--ink); color: #fff; }
  .btn {
    border: none; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: 800;
    background: var(--card); box-shadow: 0 5px 0 rgba(0,0,0,.12); min-width: 72px;
  }
  .btn.big { font-size: 40px; padding: 10px 28px; }
  .row { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }

  /* ---------- 글자 조합 ---------- */
  .display {
    width: min(90vw, 620px); height: min(26vh, 220px); flex-shrink: 0;
    background: var(--card); border-radius: 28px; box-shadow: 0 6px 0 rgba(0,0,0,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #bigChar { font-size: min(16vh, 140px); font-weight: 800; line-height: 1.05; min-height: 1em; }
  #formula { font-size: min(3.6vh, 30px); font-weight: 700; color: var(--muted); min-height: 1.3em; }
  .c { color: var(--c1); } .v { color: var(--c3); }
  .keys { display: grid; gap: 10px; }
  .keys.cons { grid-template-columns: repeat(7, var(--k)); }
  .keys.vow { grid-template-columns: repeat(5, var(--k)); }
  .key {
    width: var(--k); height: var(--k); border: none; border-radius: 18px;
    font-size: calc(var(--k) * .5); font-weight: 800; background: var(--cons);
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
  }
  .key.vow { background: var(--vow); }
  .key.sel { outline: 5px solid var(--c1); outline-offset: -5px; }
  .key.vow.sel { outline-color: var(--c3); }
  .b { color: var(--c2); }
  #compose { --k: min(calc((100vw - 120px) / 11), 9vh, 88px); gap: 10px; }
  #compose .display { height: min(26vh, 220px); }
  #compose .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: calc(var(--k) * 10 + 72px); }
  #compose .keys.vow { max-width: none; flex-wrap: nowrap; }
  @media (orientation: portrait) {   /* 세로 화면: 줄을 늘리고 버튼을 크게 */
    #compose { --k: min(calc((100vw - 88px) / 7), 8.5vh, 88px); }
    #compose .keys { max-width: calc(var(--k) * 7 + 48px); }
    #compose .keys.vow { flex-wrap: wrap; max-width: calc(var(--k) * 6 + 40px); }
  }
  .key.dbl { background: #ffc9bd; }
  .key.hint { animation: glow .7s infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 0 0 #ffd54a; } to { box-shadow: 0 0 0 8px #ffd54a; } }
  .vtabs .tab { font-size: 18px; padding: 6px 16px; }
  #missionBox { gap: 6px; padding: 8px 14px; }
  #mTop { display: flex; align-items: center; gap: 18px; }
  #mPic { font-size: min(12vh, 100px); line-height: 1.05; }
  #mWord { font-weight: 800; letter-spacing: 2px; color: #cbbba8; white-space: nowrap; }
  #mWord .done { color: var(--c2); }
  #mWord .cur { color: var(--c1); text-decoration: underline; text-underline-offset: 6px; }
  #mSlots { display: flex; gap: 8px; }
  .slot {
    border: 3px dashed #d9cbb8; border-radius: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .slot.cur { border: 4px solid var(--c1); }
  .slot.done { border: 3px solid var(--c2); background: #c9f2df; }

  /* ---------- 퀴즈 ---------- */
  .stars { font-size: 30px; min-height: 40px; letter-spacing: 2px; }
  .ask { font-size: 24px; font-weight: 700; color: var(--muted); }
  .opts { display: grid; grid-template-columns: repeat(2, auto); gap: 18px; }
  .opts.three { grid-template-columns: repeat(3, auto); }
  .opt {
    --s: min(28vw, 25vh, 210px);
    width: var(--s); height: var(--s); border: none; border-radius: 28px;
    font-size: calc(var(--s) * .48); font-weight: 800; background: var(--card);
    box-shadow: 0 6px 0 rgba(0,0,0,.12); transition: background .2s, opacity .2s;
  }
  .opt.word { font-size: calc(var(--s) * .24); }
  .opt.right { background: #c9f2df; }
  .opt.wrong { opacity: .35; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px)} 75%{transform:translateX(12px)} }
  #pic { font-size: min(22vh, 180px); line-height: 1.1; }
  .dpic { width: 1.45em; height: 1em; vertical-align: middle; }
  .cats .tab { font-size: 18px; padding: 8px 14px; }
  #noBatchim.on, #mNoB.on { background: var(--c2); }

  /* ---------- 따라 쓰기 ---------- */
  #traceWrap { position: relative; background: var(--card); border-radius: 28px; box-shadow: 0 6px 0 rgba(0,0,0,.08); flex-shrink: 0; }
  #traceWrap canvas { position: absolute; left: 0; top: 0; border-radius: 28px; }
  #drawLayer { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .color { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .color.on { border-color: var(--ink); }

  /* ---------- 단어 카드 ---------- */
  .wordCard {
    width: min(88vw, 520px); flex-shrink: 0; background: var(--card); border-radius: 32px;
    box-shadow: 0 6px 0 rgba(0,0,0,.08); padding: 18px; text-align: center;
  }
  #cardPic { font-size: min(24vh, 190px); line-height: 1.15; }
  #cardWord { font-size: min(10vh, 84px); font-weight: 800; letter-spacing: 6px; }
  #cardWord .first { color: var(--c1); }
  #cardSplit { font-size: min(3.6vh, 28px); font-weight: 700; color: var(--muted); min-height: 1.3em; }

  /* ---------- 칭찬 효과 ---------- */
  .fx { position: fixed; pointer-events: none; font-size: 44px; animation: pop 1.2s ease-out forwards; z-index: 50; }
  @keyframes pop {
    0% { transform: translate(0,0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
  }
  #banner {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(255,248,236,.85); font-size: min(9vw, 64px); font-weight: 800; z-index: 40; text-align: center;
  }
</style>
</head>
<body>
<header>
  <button id="homeBtn" aria-label="처음으로">🏠</button>
  <div id="title">한글 놀이터</div>
  <div id="starBox">⭐ <span id="starCount">0</span></div>
</header>

<main>
  <!-- 홈 -->
  <section class="screen active" id="home">
    <div class="menu">
      <button data-go="compose" style="background:var(--c1)"><span>🧩</span>글자 만들기</button>
      <button data-go="quiz" style="background:var(--c3)"><span>👂</span>듣고 고르기</button>
      <button data-go="trace" style="background:var(--c2)"><span>✏️</span>따라 쓰기</button>
      <button data-go="words" style="background:var(--c4)"><span>🖼️</span>그림 단어</button>
    </div>
    <div id="voiceTip">이 기기에서 한국어 음성을 찾지 못했습니다. 소리가 나지 않으면 기기 설정에서 한국어 음성을 추가해 주세요.</div>
  </section>

  <!-- 글자 만들기 -->
  <section class="screen" id="compose">
    <div class="tabs" id="cmpModes">
      <button class="tab on" data-m="mission">🎯 낱말 만들기</button>
      <button class="tab" data-m="free">🧩 마음대로 만들기</button>
    </div>
    <div class="display" id="missionBox">
      <div id="mTop"><div id="mPic"></div><div id="mWord"></div></div>
      <div id="mSlots"></div>
    </div>
    <div class="display" id="composeDisplay" style="display:none">
      <div id="bigChar">?</div>
      <div id="formula">자음과 모음을 눌러 보세요</div>
    </div>
    <div class="keys cons" id="consKeys"></div>
    <div class="tabs vtabs" id="vowTabs">
      <button class="tab on" data-g="0">기본 모음</button>
      <button class="tab" data-g="1">더 많은 모음</button>
    </div>
    <div class="keys vow" id="vowKeys"></div>
    <div class="row" id="missionCtl">
      <button class="btn" id="mCat">📚 전체 ▸</button>
      <button class="tab" id="mNoB">받침 없는 낱말만</button>
      <button class="btn" id="mSay">🔊</button>
      <button class="btn" id="mSkip">⏭️</button>
    </div>
    <div class="row" id="freeCtl" style="display:none">
      <button class="btn" id="composeBack">⬅️ 지우기</button>
      <button class="btn" id="composeClear">🔄 다시</button>
    </div>
  </section>

  <!-- 듣고 고르기 -->
  <section class="screen" id="quiz">
    <div class="tabs" id="quizTabs">
      <button class="tab on" data-lv="cons">자음</button>
      <button class="tab" data-lv="vow">모음</button>
      <button class="tab" data-lv="syl">글자</button>
    </div>
    <div class="stars" id="quizStars"></div>
    <button class="btn big" id="quizSay">🔊 듣기</button>
    <div class="ask">소리를 듣고 맞는 글자를 눌러요</div>
    <div class="opts" id="quizOpts"></div>
  </section>

  <!-- 따라 쓰기 -->
  <section class="screen" id="trace">
    <div class="tabs" id="traceTabs">
      <button class="tab on" data-set="cons">자음</button>
      <button class="tab" data-set="vow">모음</button>
      <button class="tab" data-set="syl">글자</button>
    </div>
    <div id="traceWrap">
      <canvas id="guideLayer"></canvas>
      <canvas id="drawLayer"></canvas>
    </div>
    <div class="row">
      <button class="btn" id="tracePrev">◀</button>
      <button class="btn" id="traceSay">🔊</button>
      <button class="btn" id="traceClear">🔄 처음부터</button>
      <button class="btn" id="traceDone">⏭️ 건너뛰기</button>
      <button class="btn" id="traceNext">▶</button>
    </div>
    <div class="row">
      <button class="btn" id="traceShow">✋ 순서 보기</button>
      <button class="btn" id="traceHint">🔢 번호 끄기</button>
      <div class="row" id="colors"></div>
    </div>
  </section>

  <!-- 그림 단어 -->
  <section class="screen" id="words">
    <div class="tabs" id="wordTabs">
      <button class="tab on" data-mode="card">카드 보기</button>
      <button class="tab" data-mode="match">맞히기</button>
      <button class="tab" id="noBatchim">받침 없는 낱말만</button>
    </div>
    <div class="tabs cats" id="catTabs"></div>
    <div id="cardMode" style="display:contents">
      <div class="wordCard" id="wordCard">
        <div id="cardPic"></div>
        <div id="cardWord"></div>
        <div id="cardSplit"></div>
      </div>
      <div class="row">
        <button class="btn" id="cardPrev">◀</button>
        <button class="btn big" id="cardSay">🔊</button>
        <button class="btn" id="cardNext">▶</button>
      </div>
    </div>
    <div id="matchMode" style="display:none; flex-direction:column; align-items:center; gap:14px">
      <div class="stars" id="matchStars"></div>
      <div id="pic"></div>
      <div class="ask">그림에 맞는 낱말을 골라요</div>
      <div class="opts three" id="matchOpts"></div>
    </div>
  </section>
</main>

<div id="banner"></div>

<script>
/* ================= 한글 데이터 ================= */
const CHO  = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CONS = [
  ['ㄱ','기역'],['ㄴ','니은'],['ㄷ','디귿'],['ㄹ','리을'],['ㅁ','미음'],['ㅂ','비읍'],['ㅅ','시옷'],
  ['ㅇ','이응'],['ㅈ','지읒'],['ㅊ','치읓'],['ㅋ','키읔'],['ㅌ','티읕'],['ㅍ','피읖'],['ㅎ','히읗']
];
const CONS_NAME = Object.fromEntries(CONS);
const VOWS = ['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];

/* 그림 단어: [그림, 낱말]. 그림이 'dino:이름'이면 아래 DINO 그림(SVG)을 씁니다 */
const CATS = [
  { id: 'dino', name: '🦖 공룡', words: [
    ['dino:trex','티라노사우루스'],['dino:tri','트리케라톱스'],['dino:stego','스테고사우루스'],
    ['dino:brachio','브라키오사우루스'],['dino:ptera','프테라노돈'],['dino:anky','안킬로사우루스'],
    ['dino:spino','스피노사우루스'],['dino:raptor','벨로키랍토르'],['🦴','뼈'],['🌋','화산']
  ]},
  { id: 'animal', name: '🐶 동물', words: [
    ['🐶','개'],['🐱','고양이'],['🐰','토끼'],['🦁','사자'],['🐯','호랑이'],['🐘','코끼리'],
    ['🦒','기린'],['🐵','원숭이'],['🐻','곰'],['🐷','돼지'],['🐮','소'],['🐴','말'],
    ['🦊','여우'],['🐼','판다'],['🐭','쥐'],['🐑','양'],['🦓','얼룩말'],['🦛','하마'],
    ['🐔','닭'],['🦆','오리']
  ]},
  { id: 'sea', name: '🐟 바다·곤충', words: [
    ['🐳','고래'],['🐙','문어'],['🦀','게'],['🐢','거북이'],['🐟','물고기'],['🦈','상어'],
    ['🐬','돌고래'],['🦑','오징어'],['🦐','새우'],['🦋','나비'],['🐜','개미'],['🐝','벌'],
    ['🕷️','거미'],['🐞','무당벌레'],['🐌','달팽이']
  ]},
  { id: 'fruit', name: '🍎 과일', words: [
    ['🍎','사과'],['🍌','바나나'],['🍇','포도'],['🍓','딸기'],['🍉','수박'],['🍑','복숭아'],
    ['🍋','레몬'],['🍒','체리'],['🍍','파인애플'],['🥝','키위'],['🍊','귤'],['🥭','망고'],
    ['🍈','멜론']
  ]},
  { id: 'food', name: '🥕 채소·음식', words: [
    ['🥕','당근'],['🥔','감자'],['🌽','옥수수'],['🍅','토마토'],['🥒','오이'],['🧅','양파'],
    ['🍄','버섯'],['🥛','우유'],['🍕','피자'],['🧀','치즈'],['🍞','빵'],['🥚','달걀'],
    ['🍙','주먹밥'],['🍦','아이스크림'],['🍰','케이크'],['🍭','사탕']
  ]},
  { id: 'ride', name: '🚗 탈것', words: [
    ['🚗','자동차'],['🚂','기차'],['🚌','버스'],['✈️','비행기'],['🚢','배'],['🚲','자전거'],
    ['🚁','헬리콥터'],['🚑','구급차'],['🚒','소방차'],['🚓','경찰차'],['🚀','로켓'],['🚜','트랙터'],
    ['🚕','택시']
  ]},
  { id: 'thing', name: '👕 옷·물건', words: [
    ['🧢','모자'],['👖','바지'],['🧦','양말'],['☂️','우산'],['⏰','시계'],['🎒','가방'],
    ['🪑','의자'],['⚽','공'],['👟','운동화'],['🧤','장갑'],['👓','안경'],['🧸','곰인형'],
    ['📚','책'],['✏️','연필'],['🎁','선물']
  ]},
  { id: 'nature', name: '🌳 자연·날씨', words: [
    ['☀️','해'],['🌙','달'],['⭐','별'],['🌳','나무'],['🌸','꽃'],['☁️','구름'],
    ['🌧️','비'],['⛄','눈사람'],['🌈','무지개'],['⚡','번개'],['🌊','파도'],['⛰️','산'],
    ['🍂','낙엽']
  ]},
  { id: 'body', name: '👀 몸', words: [
    ['👀','눈'],['👃','코'],['👄','입'],['👂','귀'],['✋','손'],['🦶','발'],
    ['🦷','이'],['🦵','다리'],['👅','혀']
  ]}
];
const WORDS = CATS.flatMap(c => c.words);

function picHTML(p) {
  if (p.startsWith('dino:')) return `<svg class="dpic" viewBox="-4 0 246 166" aria-hidden="true">${DINO[p.slice(5)]}</svg>`;
  return p;
}

const compose = (c, v) => String.fromCharCode(0xAC00 + (CHO.indexOf(c) * 21 + JUNG.indexOf(v)) * 28);
const jamoSay = j => CONS_NAME[j] || compose('ㅇ', j);
function split(ch) {
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return null;
  return [CHO[Math.floor(code / 588)], JUNG[Math.floor((code % 588) / 28)], JONG[code % 28]];
}
const rand = n => Math.floor(Math.random() * n);
const pick = arr => arr[rand(arr.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const $ = id => document.getElementById(id);

/* ================= 소리 ================= */
let koVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => /^ko/i.test(v.lang) && /yuna|유나|google/i.test(v.name))
         || vs.find(v => /^ko/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
  setTimeout(() => { pickVoice(); if (!koVoice) $('voiceTip').style.display = 'block'; }, 2000);
} else {
  $('voiceTip').style.display = 'block';
}
function speak(text, rate = 0.8) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice;
  u.rate = rate; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

let actx = null;
function tone(freqs) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * 0.12;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.35);
    });
  } catch (e) { /* 소리 장치 없음 */ }
}
const goodTone = () => tone([660, 880, 1320]);
const badTone = () => tone([300, 220]);

function runChoice(box, starBox, q, state, onNext) {
  box.innerHTML = '';

  const round = state.round = (state.round || 0) + 1;   // 탭/화면이 바뀌면 이전 타이머 무시
  const next = () => { if (state.round === round) onNext(); };
  q.options.forEach(o => {

    b.className = 'opt' + (q.wordStyle ? ' word' : ''); b.textContent = o;
    if (q.wordStyle) b.style.fontSize = `calc(var(--s) * ${Math.min(0.24, 0.9 / o.length).toFixed(3)})`;
    b.onclick = () => {
      if (state.locked || b.classList.contains('wrong')) return;
      if (o === q.answer) {
        state.locked = true; b.classList.add('right');
        goodTone(); celebrate(b); addStar();
        state.streak++;
        starBox.textContent = '⭐'.repeat(state.streak % 10 || (state.streak ? 10 : 0));
        setTimeout(() => speak(q.praiseSay ? q.praiseSay + ', ' + pick(PRAISE) : pick(PRAISE)), 350);
        if (state.streak % 10 === 0) setTimeout(() => banner('🎉 별 10개 모았어요! 🎉'), 900);
        setTimeout(next, state.streak % 10 === 0 ? 2800 : 1700);
      } else {
        b.classList.add('wrong', 'shake'); badTone();

        if (q.say) setTimeout(() => speak(q.say), 500);

let quizLv = 'cons', lastQ = null;
const quizState = { streak: 0, locked: false, round: 0 };
let quizQ = null;
function makeQuiz(lv) {
  let answer, options, say;
  if (lv === 'cons') {
    const pool = CONS.map(c => c[0]);
    do { answer = pick(pool); } while (answer === lastQ);
    options = shuffle([answer, ...shuffle(pool.filter(x => x !== answer)).slice(0, 3)]);
    say = CONS_NAME[answer];
  } else if (lv === 'vow') {
    do { answer = pick(VOWS); } while (answer === lastQ);
    options = shuffle([answer, ...shuffle(VOWS.filter(x => x !== answer)).slice(0, 3)]);
    say = jamoSay(answer);
  } else {
    let c, v;
    do { c = pick(CONS)[0]; v = pick(VOWS); answer = compose(c, v); } while (answer === lastQ);
    // 보기: 같은 자음 1개, 같은 모음 1개, 아무거나 1개 → 비교하며 배우도록
    const set = new Set([answer]);
    const add = s => { if (!set.has(s)) set.add(s); };
    while (set.size < 2) add(compose(c, pick(VOWS)));
    while (set.size < 3) add(compose(pick(CONS)[0], v));
    while (set.size < 4) add(compose(pick(CONS)[0], pick(VOWS)));
    options = shuffle([...set]);
    say = answer;
  }
  lastQ = answer;
  return { answer, options, say };
}
function newQuiz() {
  quizQ = makeQuiz(quizLv);
  runChoice($('quizOpts'), $('quizStars'), quizQ, quizState, newQuiz);
  setTimeout(() => speak(quizQ.say), 300);
}

    const col = STROKE_COLORS[i % STROKE_COLORS.length];
    // 가는 안내선 + 끝 화살촉
    gctx.strokeStyle = col; gctx.lineWidth = s * 0.012; gctx.setLineDash([s * 0.025, s * 0.02]);
    polyline(gctx, st, s); gctx.setLineDash([]);
    const end = st[st.length - 1], prev = st[Math.max(0, st.length - (st.length > 5 ? 4 : 2))];
    const [ux, uy] = unit(prev, end), a = s * 0.045;
    const ex = end[0] * s, ey = end[1] * s;
    gctx.fillStyle = col; gctx.beginPath();
    gctx.moveTo(ex + ux * a * 0.4, ey + uy * a * 0.4);
    gctx.lineTo(ex - ux * a - uy * a * 0.6, ey - uy * a + ux * a * 0.6);
    gctx.lineTo(ex - ux * a + uy * a * 0.6, ey - uy * a - ux * a * 0.6);
    gctx.closePath(); gctx.fill();
    // 시작점 번호 (획 방향의 반대쪽에 붙임)
    const [dx, dy] = unit(st[0], st[Math.min(st.length - 1, st.length > 5 ? 3 : 1)]);
    let lx = st[0][0] * s - dx * r * 1.5, ly = st[0][1] * s - dy * r * 1.5;
    lx = Math.min(s - r - 2, Math.max(r + 2, lx)); ly = Math.min(s - r - 2, Math.max(r + 2, ly));
    gctx.beginPath(); gctx.arc(lx, ly, r, 0, Math.PI * 2); gctx.fill();
    gctx.fillStyle = '#fff'; gctx.font = `800 ${Math.round(r * 1.3)}px sans-serif`;
    gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(i + 1, lx, ly + 1);
  });
}

/* ---- 체크포인트 판정 ----
   획마다 시작~끝을 같은 간격으로 나눈 체크포인트를 둡니다.
   순서대로 모두 지나면 그 획 통과, 획에서 크게 벗어나거나 다 못 지나고 손을 떼면 그 획만 다시 씁니다. */
const HIT_R = 0.07;      // 체크포인트 통과 반경 (칸 크기 대비)
const DEV_TOL = 0.12;    // 획 중심선에서 벗어나도 되는 폭 (칸 크기 대비)
const TAP_LEN = 0.03;    // 이보다 짧게 그은 건 실수로 보고 조용히 지움
const strokeLen = st => st.slice(1).reduce((L, p, i) => L + Math.hypot(p[0] - st[i][0], p[1] - st[i][1]), 0);
function pointAt(st, d) {   // 획 시작에서 거리 d만큼 간 위치
  for (let i = 1; i < st.length; i++) {
    const seg = Math.hypot(st[i][0] - st[i - 1][0], st[i][1] - st[i - 1][1]);
    if (d <= seg || i === st.length - 1) {
      const k = seg ? Math.min(1, d / seg) : 0;
      return [st[i - 1][0] + (st[i][0] - st[i - 1][0]) * k, st[i - 1][1] + (st[i][1] - st[i - 1][1]) * k];
    }
    d -= seg;
  }
  return st[st.length - 1];
}
function partial(st, d) {   // 획의 앞부분 d 길이만큼의 점 목록
  const pts = [st[0]];
  for (let i = 1; i < st.length && d > 0; i++) {
    const seg = Math.hypot(st[i][0] - st[i - 1][0], st[i][1] - st[i - 1][1]);
    if (seg <= d) { pts.push(st[i]); d -= seg; }
    else { const k = d / seg; pts.push([st[i - 1][0] + (st[i][0] - st[i - 1][0]) * k, st[i - 1][1] + (st[i][1] - st[i - 1][1]) * k]); d = 0; }
  }
  return pts;
}
function makeCheckpoints(st) {
  const L = strokeLen(st), n = L < 0.2 ? 2 : 3;   // 시작·끝 (긴 획은 가운데 하나 더)
  return Array.from({ length: n }, (_, i) => pointAt(st, L * i / (n - 1)));
}
function segPointDist(a, b, p) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  const t = L2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)) : 0;
  return Math.hypot(a[0] + dx * t - p[0], a[1] + dy * t - p[1]);
}
function distToStroke(st, p) {
  let m = Infinity;
  for (let i = 1; i < st.length; i++) m = Math.min(m, segPointDist(st[i - 1], st[i], p));
  return m;
}

let tr = null;   // 지금 쓰는 글자의 진행 상태
function startLetter(animate = true) {
  const strokes = strokesOf(TRACE_SETS[traceSet][traceIdx]);
  tr = { strokes, cps: strokes.map(makeCheckpoints), lens: strokes.map(strokeLen),
         colors: [], cur: 0, hit: 0, done: false, last: null, ink: 0 };
  drawing = false;
  dctx.clearRect(0, 0, traceSize, traceSize);
  if (animate) animateStrokes(strokes.map((_, i) => i)); else { animToken++; renderGuide(); }
}
function renderGuide(opt = {}) {
  if (!tr) return;
  const s = traceSize;
  drawBase(tr.strokes);
  // 통과한 획은 진하게
  gctx.lineWidth = s * 0.07; gctx.lineCap = gctx.lineJoin = 'round';
  for (let i = 0; i < tr.cur; i++) { gctx.strokeStyle = tr.colors[i]; polyline(gctx, tr.strokes[i], s); }
  if (opt.bare) return;
  if (showHints) drawHints(tr.strokes, tr.cur);
  // 지금 쓸 획의 체크포인트 (지나간 점은 초록)
  if (!tr.done && tr.cur < tr.strokes.length) {
    tr.cps[tr.cur].forEach((p, j) => {
      gctx.beginPath(); gctx.arc(p[0] * s, p[1] * s, s * 0.022, 0, Math.PI * 2);
      gctx.fillStyle = j < tr.hit ? '#3dbb93' : '#fff'; gctx.fill();
      gctx.lineWidth = 3; gctx.strokeStyle = j < tr.hit ? '#2b9a77' : '#c9b8a4'; gctx.stroke();
    });
  }
}
// 순서 보기: 지정한 획들을 차례로 그리는 애니메이션
function animateStrokes(indices) {
  if (!tr) return;
  if (!indices) indices = tr.strokes.map((_, i) => i);
  const token = ++animToken, s = traceSize;
  renderGuide({ bare: true });
  let k = 0, t0 = null;
  function frame(now) {
    if (token !== animToken) return;
    if (t0 === null) t0 = now;
    const si = indices[k], st = tr.strokes[si], L = tr.lens[si];
    const f = Math.min(1, (now - t0) / (350 + L * 900));
    gctx.strokeStyle = STROKE_COLORS[si % STROKE_COLORS.length];
    gctx.lineWidth = s * 0.07; gctx.lineCap = gctx.lineJoin = 'round';
    const pts = partial(st, L * f);
    if (pts.length > 1) polyline(gctx, pts, s);
    if (f >= 1) { k++; t0 = null; }
    if (k < indices.length) requestAnimationFrame(frame);
    else setTimeout(() => { if (token === animToken) renderGuide(); }, 700);
  }
  requestAnimationFrame(frame);
}

let drawing = false;
const normP = e => [e.offsetX / traceSize, e.offsetY / traceSize];
// a→b로 펜이 움직였을 때 판정. 시도가 끝나면 false
function advance(a, b) {
  tr.ink += Math.hypot(b[0] - a[0], b[1] - a[1]);
  const i = tr.cur, st = tr.strokes[i], cps = tr.cps[i];
  if (distToStroke(st, b) > DEV_TOL) { failStroke(); return false; }
  const before = tr.hit;
  while (tr.hit < cps.length && segPointDist(a, b, cps[tr.hit]) < HIT_R) {
    if (tr.hit === cps.length - 1 && tr.ink < tr.lens[i] * 0.5) break;   // 톡 찍기만으로 끝점 통과 방지
    tr.hit++;
  }
  if (tr.hit === cps.length) { passStroke(); return false; }
  if (tr.hit !== before) renderGuide();
  return true;
}
function passStroke() {
  drawing = false;
  tr.colors[tr.cur] = penColor;
  tr.cur++; tr.hit = 0;
  dctx.clearRect(0, 0, traceSize, traceSize);
  if (tr.cur < tr.strokes.length) { tone([784, 1047]); renderGuide(); return; }
  // 글자 완성
  tr.done = true; renderGuide();
  goodTone(); celebrate($('traceWrap')); addStar();
  setTimeout(() => speak(pick(PRAISE)), 350);
  const myTr = tr;
  setTimeout(() => { if (tr === myTr && $('trace').classList.contains('active')) traceGo(1); }, 1800);
}
function failStroke(quiet = false) {
  drawing = false;
  tr.hit = 0;
  if (quiet) { dctx.clearRect(0, 0, traceSize, traceSize); renderGuide(); return; }
  badTone();
  setTimeout(() => speak('다시 해 볼까요?'), 250);
  const myTr = tr;
  setTimeout(() => {
    if (tr !== myTr) return;
    dctx.clearRect(0, 0, traceSize, traceSize);
    animateStrokes([tr.cur]);   // 이 획만 다시 보여 줌
  }, 400);
}
draw.addEventListener('pointerdown', e => {
  if (!tr || tr.done || drawing) return;
  animToken++; renderGuide();   // 순서 보기 재생 중이면 멈춤
  drawing = true; try { draw.setPointerCapture(e.pointerId); } catch (err) {}
  dctx.clearRect(0, 0, traceSize, traceSize);
  dctx.strokeStyle = penColor; dctx.lineWidth = traceSize * 0.055;
  dctx.lineCap = dctx.lineJoin = 'round';
  dctx.beginPath(); dctx.moveTo(e.offsetX, e.offsetY); dctx.lineTo(e.offsetX + 0.1, e.offsetY); dctx.stroke();
  tr.hit = 0; tr.ink = 0; tr.last = normP(e);
  inkFrom = [e.offsetX, e.offsetY]; inkPts = [];
  advance(tr.last, tr.last);
});
// 잉크는 새로 움직인 구간만, 화면 갱신마다 한 번씩 그립니다 (전체 경로를 매번 다시 그리면 획이 길수록 느려짐)
let inkFrom = null, inkPts = [], inkReq = 0;
function flushInk() {
  inkReq = 0;
  if (!drawing || !inkPts.length) { inkPts = []; return; }
  dctx.beginPath(); dctx.moveTo(inkFrom[0], inkFrom[1]);
  for (const p of inkPts) dctx.lineTo(p[0], p[1]);
  dctx.stroke();
  inkFrom = inkPts[inkPts.length - 1]; inkPts = [];
}
draw.addEventListener('pointermove', e => {
  if (!drawing) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const p of evs) {
    inkPts.push([p.offsetX, p.offsetY]);
    const q = normP(p);
    if (!advance(tr.last, q)) { inkPts = []; return; }
    tr.last = q;
  }
  if (!inkReq) inkReq = requestAnimationFrame(flushInk);
});
['pointerup', 'pointercancel'].forEach(t => draw.addEventListener(t, () => {
  if (!drawing) return;
  failStroke(tr.ink < TAP_LEN);   // 끝까지 못 가고 손을 뗌
}));

function traceGo(d) {
  const n = TRACE_SETS[traceSet].length;
  traceIdx = (traceIdx + d + n) % n; startLetter();
  speak(jamoOrSyl(TRACE_SETS[traceSet][traceIdx]));
}
const jamoOrSyl = ch => split(ch) ? ch : jamoSay(ch);
$('tracePrev').onclick = () => traceGo(-1);
$('traceNext').onclick = () => traceGo(1);
$('traceClear').onclick = () => startLetter(false);
$('traceShow').onclick = () => animateStrokes();
$('traceHint').onclick = () => {
  animToken++;
  showHints = !showHints;
  $('traceHint').textContent = showHints ? '🔢 번호 끄기' : '🔢 번호 켜기';
  renderGuide();
};
$('traceSay').onclick = () => speak(jamoOrSyl(TRACE_SETS[traceSet][traceIdx]));
$('traceDone').onclick = () => traceGo(1);   // 건너뛰기 (별 없음)
$('traceTabs').onclick = e => {
  const t = e.target.closest('.tab'); if (!t) return;
  setTabs($('traceTabs'), t); traceSet = t.dataset.set; traceIdx = 0; startLetter();
};
['#ff7f6e', '#5b9dff', '#3dbb93', '#ffb340', '#9b6bff', '#3a2e2a'].forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'color' + (i === 0 ? ' on' : ''); b.style.background = c;
  b.onclick = () => { penColor = c; document.querySelectorAll('.color').forEach(x => x.classList.toggle('on', x === b)); };
  $('colors').appendChild(b);
});
window.addEventListener('resize', () => {
  if ($('trace').classList.contains('active')) resizeTrace();
  if ($('compose').classList.contains('active') && cmpMode === 'mission') renderMission();
});

/* ================= 그림 단어 ================= */
let wordMode = 'card', wordCat = 'all', onlyNoBatchim = false;
let wordList = WORDS, wordOrder = shuffle(WORDS), wordIdx = 0;
const noBatchim = w => [...w].every(ch => { const s = split(ch); return !s || !s[2]; });
function refreshWordList() {
  const base = wordCat === 'all' ? WORDS : CATS.find(c => c.id === wordCat).words;
  wordList = onlyNoBatchim ? base.filter(w => noBatchim(w[1])) : base;
  if (!wordList.length) wordList = base;   // 걸러서 하나도 없으면 전체 사용
  wordOrder = shuffle(wordList); wordIdx = 0; lastWord = null;
  matchState.streak = 0; $('matchStars').textContent = '';
  wordMode === 'card' ? showCard() : newMatch();
}
// 카테고리 버튼 만들기
[{ id: 'all', name: '전체' }, ...CATS].forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i === 0 ? ' on' : ''); b.textContent = c.name; b.dataset.cat = c.id;
  $('catTabs').appendChild(b);
});
$('catTabs').onclick = e => {
  const t = e.target.closest('.tab'); if (!t) return;
  setTabs($('catTabs'), t); wordCat = t.dataset.cat; refreshWordList();
};
$('noBatchim').onclick = () => {
  onlyNoBatchim = !onlyNoBatchim;
  $('noBatchim').classList.toggle('on', onlyNoBatchim);
  refreshWordList();
};
function showCard() {
  const [pic, word] = wordOrder[wordIdx];
  $('cardPic').innerHTML = picHTML(pic);
  $('cardWord').style.fontSize = `min(10vh, ${Math.min(84, Math.floor(460 / word.length))}px)`;
  $('cardWord').style.letterSpacing = word.length > 5 ? '1px' : '6px';
  $('cardWord').innerHTML = `<span class="first">${word[0]}</span>${word.slice(1)}`;
  const sp = split(word[0]);
  $('cardSplit').innerHTML = sp
    ? `${word[0]} = <span class="c">${sp[0]}</span> + <span class="v">${sp[1]}</span>` + (sp[2] ? ` + <span class="c">${sp[2]}</span>` : '')
    : '';
}
function cardGo(d) {
  wordIdx = (wordIdx + d + wordOrder.length) % wordOrder.length;
  showCard(); speak(wordOrder[wordIdx][1]);
}
$('cardPrev').onclick = () => cardGo(-1);
$('cardNext').onclick = () => cardGo(1);
$('cardSay').onclick = () => speak(wordOrder[wordIdx][1]);
$('wordCard').onclick = () => speak(wordOrder[wordIdx][1]);

const matchState = { streak: 0, locked: false, round: 0 };
let lastWord = null;
function newMatch() {
  let item; do { item = pick(wordList); } while (item[1] === lastWord && wordList.length > 1);
  lastWord = item[1];
  // 보기는 같은 카테고리에서, 모자라면 전체에서 채움
  let others = shuffle(wordList.filter(w => w[1] !== item[1])).slice(0, 2);
  if (others.length < 2) others = others.concat(shuffle(WORDS.filter(w => w[1] !== item[1] && !others.includes(w))).slice(0, 2 - others.length));
  others = others.map(w => w[1]);
  $('pic').innerHTML = picHTML(item[0]);
  runChoice($('matchOpts'), $('matchStars'),
    { answer: item[1], options: shuffle([item[1], ...others]), wordStyle: true, praiseSay: item[1] },
    matchState, newMatch);
}
$('wordTabs').onclick = e => {
  const t = e.target.closest('.tab'); if (!t || !t.dataset.mode) return;
  $('wordTabs').querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === t));
  wordMode = t.dataset.mode;
  $('cardMode').style.display = wordMode === 'card' ? 'contents' : 'none';
  $('matchMode').style.display = wordMode === 'match' ? 'flex' : 'none';
  wordMode === 'card' ? showCard() : newMatch();
};
</script>
