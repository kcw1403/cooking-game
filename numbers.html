<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="숫자 놀이">
<title>숫자 놀이터</title>
<style>
  :root {
    --bg: #f3fbff; --ink: #2d3a4a; --muted: #8696a7; --card: #fff;
    --c1: #ff8a5c; --c2: #3dbb93; --c3: #5b9dff; --c4: #b07cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; color: var(--ink); cursor: pointer; border: none; }

  header { height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 18px; padding-top: env(safe-area-inset-top); }
  #homeBtn { font-size: 30px; width: 56px; height: 56px; border-radius: 16px; background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.1); }
  #homeBtn:active { transform: translateY(3px); box-shadow: none; }
  #title { font-size: 30px; font-weight: 800; flex: 1; }
  #starBox { font-size: 26px; font-weight: 800; background: var(--card); padding: 8px 16px; border-radius: 30px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }

  main { height: calc(100% - 72px - env(safe-area-inset-top)); }
  .screen { display: none; height: 100%; padding: 8px 20px 20px; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .screen.active { display: flex; }

  /* ---------- 첫 화면 ---------- */
  #rangeBtn { font-size: 22px; font-weight: 800; padding: 10px 24px; border-radius: 30px; background: var(--card); box-shadow: 0 5px 0 rgba(0,0,0,.1); }
  .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; width: min(92vw, 820px); }
  .menu button {
    border-radius: 32px; min-height: min(30vh, 250px); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font-size: clamp(22px, 3.6vw, 36px); font-weight: 800; box-shadow: 0 8px 0 rgba(0,0,0,.15);
  }
  .menu button span { font-size: clamp(50px, 9vw, 96px); line-height: 1; }
  .menu button:active, .opt:active, .plate:active, .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }

  /* ---------- 공통 ---------- */
  .btn { font-size: 26px; font-weight: 800; padding: 12px 26px; border-radius: 22px; background: var(--card); box-shadow: 0 5px 0 rgba(0,0,0,.12); }
  .ask { font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; text-align: center; min-height: 1.3em; }
  .items { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 10px; width: min(94vw, 900px); }
  .item {
    position: relative; font-size: var(--is); line-height: 1; width: calc(var(--is) * 1.25); height: calc(var(--is) * 1.25);
    display: flex; align-items: center; justify-content: center; border-radius: 24px; transition: background .2s;
  }
  .item.on { background: #fff3c4; animation: hop .35s; }
  .item .no {
    position: absolute; right: -4px; top: -6px; min-width: 40px; height: 40px; padding: 0 6px; border-radius: 20px;
    background: var(--c1); color: #fff; font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center;
  }
  @keyframes hop { 40% { transform: translateY(-18px) scale(1.12); } }
  .opts { display: flex; gap: 22px; justify-content: center; }
  .opt {
    --s: min(24vw, 24vh, 190px); width: var(--s); height: var(--s); border-radius: 30px;
    font-size: calc(var(--s) * .6); font-weight: 900; background: var(--card); box-shadow: 0 7px 0 rgba(0,0,0,.12);
    transition: background .2s, opacity .2s;
  }
  .opt.right { background: #c9f2df; }
  .opt.wrong, .plate.wrong { opacity: .35; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }
  #bigNum {
    font-size: min(30vh, 260px); font-weight: 900; color: var(--c1); line-height: 1; display: none;
    text-shadow: 0 8px 0 rgba(0,0,0,.08); animation: popin .4s;
  }
  @keyframes popin { from { transform: scale(0); } 70% { transform: scale(1.15); } }

  /* ---------- 많다·적다 ---------- */
  .plates { display: flex; gap: min(5vw, 40px); }
  .plate {
    width: min(42vw, 52vh, 400px); height: min(42vw, 52vh, 400px); border-radius: 50%;
    background: radial-gradient(circle, #fff 0 60%, #e8eef3 62% 68%, #fff 70%); box-shadow: 0 8px 0 rgba(0,0,0,.1);
    display: flex; align-items: center; justify-content: center; padding: 15%;
    transition: opacity .2s, background .2s;
  }
  /* 접시 안: 한 줄에 최대 4개씩 */
  .plate .pin { display: grid; grid-template-columns: repeat(var(--cols), auto); gap: 2px 6px; justify-content: center; }
  .plate span { font-size: min(5.6vw, 7vh, 56px); line-height: 1.1; }
  .plate.right { background: radial-gradient(circle, #c9f2df 0 60%, #a6e3c9 62% 68%, #c9f2df 70%); }
  /* 접시 + 세어 보기 버튼 묶음 */
  .plateCol { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cntBtn { font-size: 24px; padding: 10px 22px; min-width: 190px; }
  .plate span { border-radius: 12px; transition: background .2s; }
  .plate span.on { background: #fff3c4; animation: hop .35s; }

  /* ---------- 반응이 없을 때 누를 곳 반짝이기 ---------- */
  .glow { animation: glow .7s infinite alternate !important; }
  @keyframes glow { from { box-shadow: 0 0 0 0 #ffd54a; } to { box-shadow: 0 0 0 10px #ffd54a; } }

  /* ---------- 칭찬 효과 ---------- */
  .fx { position: fixed; pointer-events: none; font-size: 44px; animation: fly 1.1s ease-out forwards; z-index: 50; }
  @keyframes fly { 0% { transform: translate(0,0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; } }

  @media (orientation: portrait) {
    .menu button { min-height: min(26vh, 260px); }
    .opt { --s: min(27vw, 20vh, 200px); }
    .plates { flex-direction: column; }
    .plate { width: min(30vh, 80vw, 340px); height: min(30vh, 80vw, 340px); }
    .plate span { font-size: min(4vh, 8vw, 44px); }
    .plateCol { gap: 8px; }
    .cntBtn { font-size: 22px; padding: 8px 20px; }
  }
</style>
</head>
<body>
<header>
  <button id="homeBtn" aria-label="처음으로">🏠</button>
  <div id="title">숫자 놀이터</div>
  <div id="starBox">⭐ <span id="starCount">0</span></div>
</header>

<main>
  <!-- 첫 화면 -->
  <section class="screen active" id="home">
    <button id="rangeBtn"></button>
    <div class="menu">
      <button data-go="count" style="background:var(--c1)"><span>🍎</span>하나씩 세기</button>
      <button data-go="listen" style="background:var(--c3)"><span>👂</span>듣고 고르기</button>
      <button data-go="howmany" style="background:var(--c2)"><span>🔢</span>몇 개일까?</button>
      <button data-go="compare" style="background:var(--c4)"><span>⚖️</span>많다 적다</button>
    </div>
  </section>

  <!-- 하나씩 세기 -->
  <section class="screen" id="count">
    <div class="ask" id="countAsk"></div>
    <div class="items" id="countItems"></div>
    <div id="bigNum"></div>
  </section>

  <!-- 듣고 고르기 -->
  <section class="screen" id="listen">
    <button class="btn" id="listenSay" style="font-size:34px">🔊 듣기</button>
    <div class="opts" id="listenOpts"></div>
  </section>

  <!-- 몇 개일까? -->
  <section class="screen" id="howmany">
    <div class="ask">몇 개일까요?</div>
    <div class="items" id="hmItems"></div>
    <div class="opts" id="hmOpts"></div>
  </section>

  <!-- 많다 적다 -->
  <section class="screen" id="compare">
    <div class="ask" id="cmpAsk"></div>
    <div class="plates" id="plates"></div>
  </section>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- 숫자 읽기 ---------- */
const NATIVE = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
const SINO = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구', '십'];
const COUNTER = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];   // "한 개, 두 개"
const hasBatchim = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c % 28 !== 0; };
const eul = w => w + (hasBatchim(w) ? '을' : '를');
// ⭐는 칭찬 별과 헷갈리므로 세는 그림에 쓰지 않음
const THINGS = ['🍎', '🍓', '🍌', '🐶', '🐥', '🐟', '🚗', '🍊', '🎈', '🍪', '🦋', '🌸'];

/* ---------- 범위: 1~5 / 1~10 (기기에 기억) ---------- */
let MAX = 5;   // 처음에는 1~5로 시작 (1~10으로 바꾸면 기억)
try { if (localStorage.getItem('num-range') === '10') MAX = 10; } catch (e) {}
function renderRange() { $('rangeBtn').textContent = MAX === 5 ? '👶 1부터 5까지' : '🧒 1부터 10까지'; }
$('rangeBtn').onclick = () => {
  MAX = MAX === 5 ? 10 : 5;
  try { localStorage.setItem('num-range', String(MAX)); } catch (e) {}
  renderRange(); speak(MAX === 5 ? '일부터 오까지' : '일부터 십까지');
};
renderRange();
let lastN = 0;
function newN(min = 1) { let n; do { n = min + rand(MAX - min + 1); } while (n === lastN && MAX > min); lastN = n; return n; }

/* ---------- 소리 ---------- */
let koVoice = null;
function pickVoice() { const vs = speechSynthesis.getVoices(); koVoice = vs.find(v => v.lang === 'ko-KR') || vs.find(v => v.lang && v.lang.startsWith('ko')) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate = 0.85) {
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = rate; u.pitch = 1.2;
  speechSynthesis.speak(u);
}
let AC = null;
function tone(freqs) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    freqs.forEach((f, i) => {
      const t = AC.currentTime + i * 0.09, o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}
const goodTone = () => tone([660, 880, 1100]), badTone = () => tone([300, 220]), tick = n => tone([400 + n * 50]);

/* ---------- 별, 칭찬 ---------- */
let stars = 0;
try { stars = +localStorage.getItem('num-stars') || 0; } catch (e) {}
$('starCount').textContent = stars;
function addStar() { stars++; $('starCount').textContent = stars; try { localStorage.setItem('num-stars', stars); } catch (e) {} }
function celebrate(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 8; i++) {
    const f = document.createElement('div'); f.className = 'fx'; f.textContent = pick(['⭐', '✨', '🎉']);
    f.style.left = r.left + r.width / 2 - 22 + 'px'; f.style.top = r.top + r.height / 2 - 22 + 'px';
    const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 90;
    f.style.setProperty('--dx', Math.cos(a) * d + 'px'); f.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
  }
}
const PRAISE = ['잘했어요!', '맞았어요!', '최고예요!', '대단해요!'];
let round = 0;   // 화면이 바뀌면 예약된 다음 문제를 취소
function later(f, ms) { const r = round; setTimeout(() => { if (r === round) f(); }, ms); }
function shake(el) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 450); }

// 보기 버튼 만들기: 정답이면 onRight, 틀리면 흔들고 다시 읽기
function makeOpts(box, answer, count, onRight, again) {
  const set = new Set([answer]);
  while (set.size < Math.min(count, MAX)) set.add(1 + rand(MAX));
  box.innerHTML = ''; let locked = false;
  shuffle([...set]).forEach(n => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = n;
    b.onclick = () => {
      if (locked || b.classList.contains('wrong')) return;
      if (n === answer) { locked = true; b.classList.add('right'); goodTone(); celebrate(b); addStar(); onRight(b); }
      else { b.classList.add('wrong'); shake(b); badTone(); setTimeout(again, 400); }
    };
    box.appendChild(b);
  });
}
// 물건 그림 늘어놓기. 개수가 많을수록 작게
function layItems(box, n, thing) {
  box.innerHTML = '';
  const is = n <= 3 ? 'min(14vw, 17vh, 140px)' : n <= 6 ? 'min(11vw, 13vh, 110px)' : 'min(8.5vw, 10vh, 84px)';
  box.style.setProperty('--is', is);
  box.style.maxWidth = n > 5 ? `calc(${is} * 1.25 * 5 + 40px)` : '';   // 한 줄에 5개까지 (5+5로 세기 쉽게)
  return Array.from({ length: n }, () => { const d = document.createElement('div'); d.className = 'item'; d.textContent = thing; box.appendChild(d); return d; });
}

/* ================= 하나씩 세기 ================= */
function newCount() {
  const n = newN(), thing = pick(THINGS); let c = 0;
  $('bigNum').style.display = 'none';
  $('countAsk').textContent = '하나씩 눌러서 세어 봐요!';
  const its = layItems($('countItems'), n, thing);
  its.forEach(it => it.onclick = () => {
    if (it.classList.contains('on')) { speak(NATIVE[+it.dataset.no]); return; }
    c++; it.dataset.no = c; it.classList.add('on');
    const b = document.createElement('div'); b.className = 'no'; b.textContent = c; it.appendChild(b);
    tick(c); speak(NATIVE[c], 1);
    if (c === n) {
      $('countAsk').textContent = `모두 ${n}개!`;
      later(() => {
        const big = $('bigNum'); big.textContent = n; big.style.display = 'block';
        goodTone(); celebrate(big); addStar(); speak(`모두 ${NATIVE[n]}! 숫자 ${SINO[n]}`);
      }, 600);
      later(newCount, 3800);
    }
  });
  speak('하나씩 눌러서 세어 봐요!');
}

/* ================= 듣고 고르기 ================= */
let listenN = 0;
const listenSay = () => speak(`${NATIVE[listenN]}! 숫자 ${eul(SINO[listenN])} 찾아요!`);
function newListen() {
  listenN = newN();
  makeOpts($('listenOpts'), listenN, 3, () => { later(() => speak(`${SINO[listenN]}, ${pick(PRAISE)}`), 300); later(newListen, 2000); }, listenSay);
  later(listenSay, 300);
}
$('listenSay').onclick = listenSay;

/* ================= 몇 개일까? ================= */
let hmN = 0;
function newHowMany() {
  hmN = newN(); const thing = pick(THINGS); let c = 0;
  const its = layItems($('hmItems'), hmN, thing);
  its.forEach(it => it.onclick = () => {   // 그림을 누르면 하나씩 세어 줌 (도움용)
    if (it.classList.contains('on')) return;
    c++; it.classList.add('on'); const b = document.createElement('div'); b.className = 'no'; b.textContent = c; it.appendChild(b);
    tick(c); speak(NATIVE[c], 1);
  });
  makeOpts($('hmOpts'), hmN, 3, () => { later(() => speak(`${COUNTER[hmN]} 개! ${SINO[hmN]}, ${pick(PRAISE)}`), 300); later(newHowMany, 2300); },
    () => speak('그림을 하나씩 눌러서 세어 봐요!'));
  later(() => speak('몇 개일까요?'), 300);
}

/* ================= 많다 적다 ================= */
let cmpQ = null;
const cmpSay = () => speak(cmpQ.more ? '어느 쪽이 더 많을까요?' : '어느 쪽이 더 적을까요?');
function newCompare() {
  // 두 접시의 개수 차이는 2개 이상 (1개 차이는 3세가 눈으로 비교하기 어려움)
  let a, b; do { a = 1 + rand(MAX); b = 1 + rand(MAX); } while (Math.abs(a - b) < 2);
  // 두 접시의 한 줄 개수를 같게 맞춰서, 줄 길이로 비교할 수 있게
  const big = Math.max(a, b), cols = big <= 4 ? 2 : big <= 9 ? 3 : 4;
  const more = Math.random() < 0.7, thing = pick(THINGS);
  cmpQ = { a, b, more };
  $('cmpAsk').textContent = more ? '어느 쪽이 더 많을까요?' : '어느 쪽이 더 적을까요?';
  const box = $('plates'); box.innerHTML = ''; let locked = false;
  cmpCountId++;
  [a, b].forEach(n => {
    const col = document.createElement('div'); col.className = 'plateCol';
    const p = document.createElement('button'); p.className = 'plate';
    p.innerHTML = `<div class="pin" style="--cols:${cols}">` + Array.from({ length: n }, () => `<span>${thing}</span>`).join('') + '</div>';
    // 세어 보기 버튼: 정답 확인과 상관없이 그 접시의 그림을 하나씩 세어 줌 (별 없음)
    const cb = document.createElement('button'); cb.className = 'btn cntBtn'; cb.textContent = '🔢 세어 볼까?';
    cb.onclick = () => countPlate(p, cb, n);
    const right = more ? n === Math.max(a, b) : n === Math.min(a, b);
    p.onclick = () => {
      if (locked || p.classList.contains('wrong')) return;
      if (right) {
        locked = true; cmpCountId++; p.classList.add('right'); goodTone(); celebrate(p); addStar();
        const big = COUNTER[Math.max(a, b)], small = COUNTER[Math.min(a, b)];
        later(() => speak((more ? `${big} 개가 ${small} 개보다 많아요! ` : `${small} 개가 ${big} 개보다 적어요! `) + pick(PRAISE)), 300);
        later(newCompare, 2800);
      } else { cmpCountId++; p.classList.add('wrong'); shake(p); badTone(); setTimeout(cmpSay, 400); }
    };
    col.appendChild(p); col.appendChild(cb); box.appendChild(col);
  });
  later(cmpSay, 300);
}
// 접시 그림을 0.7초마다 하나씩 표시하며 "하나, 둘, …"을 읽고, 끝나면 "○ 개!"
// 새로 세기 시작하거나, 접시를 누르거나, 다음 문제로 넘어가면 cmpCountId가 바뀌어 세던 것을 멈춤
let cmpCountId = 0;
function countPlate(plate, btn, n) {
  const id = ++cmpCountId, r = round;
  document.querySelectorAll('#plates .plate span.on').forEach(s => s.classList.remove('on'));
  const spans = plate.querySelectorAll('span');
  const alive = () => id === cmpCountId && r === round;
  let i = 0;
  const step = () => {
    if (!alive()) return;
    if (i < n) {
      spans[i].classList.add('on'); i++;
      tick(i); speak(NATIVE[i], 1);
      setTimeout(step, 700);
    } else {
      btn.textContent = `🔢 ${n}개`;
      speak(`${COUNTER[n]} 개!`);
    }
  };
  step();
}

/* ================= 반응이 없을 때 다시 안내 ================= */
// 놀이 화면에서 8초 동안 아무것도 누르지 않으면 문제를 다시 읽고 누를 곳을 반짝이게 합니다. 그 뒤로는 12초마다 반복합니다.
const IDLE = {
  count: () => { speak('하나씩 눌러서 세어 봐요!'); return document.querySelector('#countItems .item:not(.on)'); },
  listen: () => { listenSay(); return $('listenSay'); },
  howmany: () => { speak('몇 개일까요? 그림을 하나씩 눌러서 세어 봐요!'); return document.querySelector('#hmItems .item:not(.on)'); },
  compare: () => { cmpSay(); return [...document.querySelectorAll('#plates .cntBtn')]; },
};
let idleT = null, curScreen = 'home';
function clearGlow() { document.querySelectorAll('.glow').forEach(e => e.classList.remove('glow')); }
function resetIdle() {
  clearTimeout(idleT); clearGlow();
  if (!IDLE[curScreen]) return;
  const fire = () => { [].concat(IDLE[curScreen]() || []).forEach(t => t.classList.add('glow')); idleT = setTimeout(fire, 12000); };
  idleT = setTimeout(fire, 8000);
}
document.addEventListener('pointerdown', resetIdle, true);

/* ================= 화면 전환 ================= */
const TITLES = { home: '숫자 놀이터', count: '하나씩 세기', listen: '듣고 고르기', howmany: '몇 개일까?', compare: '많다 적다' };
const START = { count: newCount, listen: newListen, howmany: newHowMany, compare: newCompare };
function show(id) {
  round++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  $('title').textContent = TITLES[id];
  curScreen = id;
  if (START[id]) START[id]();
  resetIdle();
}
// 🏠: 놀이 안에서는 숫자 놀이터 첫 화면으로, 첫 화면에서는 놀이 선택 화면으로
$('homeBtn').onclick = () => {
  if ($('home').classList.contains('active')) location.href = 'index.html';
  else show('home');
};
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));

/* ---------- 확대·길게 누르기 메뉴 막기 ---------- */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
