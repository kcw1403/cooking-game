<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="요리놀이">
<title>샌드위치 만들기</title>
<style>
:root{ --u:min(1vw,1vh); --accent:#ff8a3d; --brown:#6b3e1e; }
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(#fff6e0,#ffe0bd);}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

/* 상단 진행 표시 */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:calc(var(--u)*1.5);padding:calc(var(--u)*1.4) calc(var(--u)*2);}
#progress{flex:1;display:flex;justify-content:center;gap:calc(var(--u)*1);}
.pdot{width:calc(var(--u)*6.5);height:calc(var(--u)*6.5);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*3.6);opacity:.4;border:calc(var(--u)*.5) solid transparent;transition:.3s;}
.pdot.cur{opacity:1;border-color:var(--accent);transform:scale(1.15);}
.pdot.done{opacity:1;background:#d4f3cf;}
#home{position:relative;flex:0 0 auto;width:calc(var(--u)*7.5);height:calc(var(--u)*7.5);border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*4);box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1) rgba(0,0,0,.12);}
#home svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
#home circle{fill:none;stroke:var(--accent);stroke-width:8;stroke-dasharray:283;stroke-dashoffset:283;}
#home.holding circle{transition:stroke-dashoffset 1.2s linear;stroke-dashoffset:0;}

/* 무대 */
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;}
#caption{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);
  min-height:calc(var(--u)*11);padding:calc(var(--u)*1.2) calc(var(--u)*3);
  font-size:calc(var(--u)*4);font-weight:800;color:var(--brown);text-align:center;background:rgba(255,255,255,.55);}
#capIcon{font-size:calc(var(--u)*4.5);}

.obj{position:absolute;}
.emo{display:flex;align-items:center;justify-content:center;line-height:1;}
.tool{position:absolute;font-size:calc(var(--u)*11);pointer-events:none;z-index:40;transform:translate(-30%,-85%);line-height:1;}
.particle{position:absolute;font-size:calc(var(--u)*4);pointer-events:none;z-index:50;line-height:1;
  transform:translate(-50%,-50%);animation:fly .9s ease-out forwards;}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
.ftext{position:absolute;z-index:55;pointer-events:none;font-weight:900;color:#ff6a00;white-space:nowrap;
  font-size:calc(var(--u)*6);-webkit-text-stroke:calc(var(--u)*.25) #fff;transform:translate(-50%,-50%);animation:rise-t 1s ease-out forwards;}
.ftext.big{font-size:calc(var(--u)*10);color:#ff4f81;}
@keyframes rise-t{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{transform:translate(-50%,-60%) scale(1.1);opacity:1}
  100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.shine{animation:shine 1s ease-in-out 2;}
@keyframes shine{50%{filter:brightness(1.25) drop-shadow(0 0 calc(var(--u)*2) #fff6a0);transform:scale(1.06)}}
.wiggle{animation:wiggle 1s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* 힌트 손가락 */
.hint{position:absolute;z-index:60;pointer-events:none;width:0;height:0;}
.hand{position:absolute;left:calc(var(--u)*-3.5);top:calc(var(--u)*-1);font-size:calc(var(--u)*10);line-height:1;
  filter:drop-shadow(0 calc(var(--u)*.5) calc(var(--u)*.6) rgba(0,0,0,.3));}

/* 시작/끝 화면 */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);}
.bigemo{font-size:calc(var(--u)*26);line-height:1;animation:bounce 1.4s ease-in-out infinite;}
@keyframes bounce{50%{transform:translateY(calc(var(--u)*-3)) rotate(-4deg)}}
.title{font-size:calc(var(--u)*8);font-weight:900;color:var(--brown);}
.bigbtn{font-size:calc(var(--u)*6);font-weight:900;color:#fff;background:linear-gradient(#ffa54f,#ff7a1a);border:none;
  border-radius:calc(var(--u)*6);padding:calc(var(--u)*2.5) calc(var(--u)*8);box-shadow:0 calc(var(--u)*1) 0 #d65f00;font-family:inherit;}
.bigbtn:active{transform:translateY(calc(var(--u)*.8));box-shadow:0 calc(var(--u)*.2) 0 #d65f00;}

/* 1. 씻기 */
.sink{position:absolute;left:8%;right:8%;bottom:4%;height:58%;background:linear-gradient(#cdeeff,#8fd0ff);
  border:calc(var(--u)*1.2) solid #e3eaf0;border-radius:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*8) calc(var(--u)*8);}
.stream{position:absolute;left:calc(50% - var(--u)*.9);top:calc(var(--u)*9);width:calc(var(--u)*1.8);height:30%;
  background:repeating-linear-gradient(rgba(110,195,255,.9) 0 calc(var(--u)*2),rgba(170,220,255,.6) calc(var(--u)*2) calc(var(--u)*4));
  border-radius:calc(var(--u)*1);animation:flow .5s linear infinite;}
@keyframes flow{to{background-position:0 calc(var(--u)*4)}}
.dirt{position:absolute;width:calc(var(--u)*6.5);height:calc(var(--u)*5.5);margin:calc(var(--u)*-2.75) 0 0 calc(var(--u)*-3.25);
  background:radial-gradient(circle,#6e4524 0 40%,#8a5d39 42% 62%,transparent 66%);border-radius:50%;transition:opacity .2s,transform .3s;}
.dirt.clean{transform:scale(0);opacity:0!important;}

/* 2. 자르기 */
.board{background:linear-gradient(#e7bb84,#c98f52);border-radius:calc(var(--u)*3);box-shadow:0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.18);}
.seg{position:absolute;top:0;height:100%;overflow:hidden;transition:transform .3s ease-out;}
.seginner{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;line-height:1;}
.cutline{position:absolute;top:-6%;height:112%;width:0;border-left:calc(var(--u)*.7) dashed #fff;margin-left:calc(var(--u)*-.35);
  filter:drop-shadow(0 0 calc(var(--u)*.4) rgba(0,0,0,.4));animation:blink 1s ease-in-out infinite;}
.cutline.gone{display:none;}
@keyframes blink{50%{opacity:.35}}

/* 3·4. 냄비 */
.stove .stovetop{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(#5b5b5b,#333);border-radius:calc(var(--u)*2);}
.stove .flames{position:absolute;left:18%;right:18%;bottom:12%;height:24%;display:flex;justify-content:space-around;align-items:flex-end;
  font-size:calc(var(--u)*7.5);line-height:1;opacity:0;transition:opacity .3s;}
.stove .flames.on{opacity:1;}
.stove .flames span{animation:flick .25s ease-in-out infinite alternate;transform-origin:50% 100%;}
.stove .flames span:nth-child(2){animation-delay:.1s}
@keyframes flick{to{transform:scaleY(1.2) scaleX(.9)}}
.pot{position:absolute;left:9%;width:82%;top:0;height:76%;}
.potbody{position:absolute;left:0;right:0;top:18%;bottom:0;background:linear-gradient(90deg,#8d959e,#dfe4e9 40%,#8a929a);
  border-radius:0 0 calc(var(--u)*5) calc(var(--u)*5);}
.potrim{position:absolute;left:-3%;right:-3%;top:6%;height:24%;background:#b6bec6;border-radius:50%;}
.water{position:absolute;left:3%;right:3%;top:10%;height:16%;background:radial-gradient(#8fdcff,#3aa7e6);border-radius:50%;}
.handle{position:absolute;top:24%;width:12%;height:10%;background:#5f666d;border-radius:calc(var(--u)*2);}
.handle.l{left:-11%}.handle.r{right:-11%}
.potegg{position:absolute;top:-55%;font-size:calc(var(--u)*9);line-height:1;transform:translateX(-50%);animation:bob 1.2s ease-in-out infinite;}
@keyframes bob{50%{transform:translateX(-50%) translateY(calc(var(--u)*-.8)) rotate(8deg)}}
.drag{z-index:10;}
.drag.dragging{z-index:30;filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*1) rgba(0,0,0,.25));}
.firebtn{border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a6b,#e0291c);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:calc(var(--u)*7);line-height:1;box-shadow:0 calc(var(--u)*1) 0 #9e1b12;z-index:5;}
.firebtn small{font-size:calc(var(--u)*2.6);font-weight:900;margin-top:calc(var(--u)*.6);}
.firebtn.on{filter:grayscale(.7);box-shadow:none;transform:translateY(calc(var(--u)*1));}
.ring{opacity:0;transition:opacity .3s;}
.ring.on{opacity:1;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring circle{fill:#fff;stroke-width:9;}
.ring .ringbg{stroke:#ffe1c4;}
.ring .ringfg{fill:none;stroke:var(--accent);stroke-dasharray:277;stroke-dashoffset:277;transition:stroke-dashoffset 10s linear;stroke-linecap:round;}
.ringlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*6);}
.bub{position:absolute;border-radius:50%;z-index:20;
  background:radial-gradient(circle at 30% 30%,#fff 0 14%,rgba(210,240,255,.55) 40%,rgba(120,200,255,.3));
  border:calc(var(--u)*.35) solid rgba(255,255,255,.95);animation:bubrise 2.6s linear forwards;}
@keyframes bubrise{to{transform:translateY(calc(var(--u)*-30));opacity:.3}}

/* 5·6. 계란 */
.plate{border-radius:50%;background:radial-gradient(ellipse at center,#fff 0 52%,#e6e6e6 54% 60%,#fff 62%);
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.15);}
.egg{border-radius:50% 50% 50% 50% / 60% 60% 42% 42%;overflow:hidden;
  box-shadow:inset calc(var(--u)*-1.5) calc(var(--u)*-1.5) calc(var(--u)*3) rgba(0,0,0,.12),0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.15);}
.egg.shell{background:radial-gradient(circle at 35% 30%,#fbe9cd,#e8c290 70%,#d9a86f);}
.egg.peeled{background:radial-gradient(circle at 35% 30%,#fff,#f5f2eb 60%,#e4ddd0);}
.cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.shellpc{position:absolute;background:radial-gradient(circle at 30% 30%,#f7dfba,#e2b682);}
.flypiece{position:absolute;width:calc(var(--u)*6);height:calc(var(--u)*5);margin:calc(var(--u)*-2.5) 0 0 calc(var(--u)*-3);
  background:#e6bb86;border-radius:20% 40% 30% 50%;pointer-events:none;z-index:45;}

/* 7. 으깨기 */
.bowl .body{position:absolute;left:0;right:0;top:22%;bottom:0;background:linear-gradient(#63b8ec,#2c80bd);
  border-radius:0 0 50% 50% / 0 0 100% 100%;}
.bowl .rim{position:absolute;left:0;right:0;top:0;height:46%;border-radius:50%;background:#d6eefc;border:calc(var(--u)*.9) solid #4ea4dc;}
.bowl .inside{position:absolute;left:7%;right:7%;top:5%;height:36%;border-radius:50%;overflow:hidden;background:#bfe2f8;}
.chunk{position:absolute;border-radius:45% 55% 50% 40%;background:radial-gradient(circle at 50% 55%,#ffcc33 0 30%,#fff 33%);
  box-shadow:inset calc(var(--u)*-.4) calc(var(--u)*-.4) calc(var(--u)*.8) rgba(0,0,0,.1);transition:transform .2s,opacity .2s;}
.mash{position:absolute;left:4%;right:4%;top:8%;bottom:4%;border-radius:50%;background:radial-gradient(#ffe27a,#ffcf3a);
  transform:scale(0);transition:transform .2s;}
.mash .pale{position:absolute;inset:0;border-radius:50%;background:radial-gradient(#fff6cf,#ffe795);opacity:0;}
.blob{position:absolute;width:22%;height:40%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#f4ecd2);
  box-shadow:0 0 calc(var(--u)*.6) rgba(0,0,0,.12);animation:popin .3s ease-out;}
@keyframes popin{from{transform:scale(0)}}
.mayo{z-index:5;}
.mayo .cap{position:absolute;left:32%;width:36%;top:0;height:16%;background:#e53935;border-radius:calc(var(--u)*1) calc(var(--u)*1) 0 0;}
.mayo .tube{position:absolute;left:0;right:0;top:14%;bottom:0;background:linear-gradient(90deg,#f3e9c4,#fffdf3 45%,#efe2b5);
  border-radius:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*2) calc(var(--u)*2);display:flex;align-items:center;justify-content:center;
  color:#e53935;font-weight:900;font-size:calc(var(--u)*3.6);box-shadow:0 calc(var(--u)*.8) calc(var(--u)*1.5) rgba(0,0,0,.15);}
.squeeze{animation:squeeze .3s;}
@keyframes squeeze{50%{transform:scaleX(1.18) scaleY(.85)}}

/* 8. 바르기 */
.breadtop{background:#f9e2b2;border:calc(var(--u)*1.8) solid #c9883a;border-radius:42% 42% 10% 10% / 34% 34% 8% 8%;overflow:hidden;
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.18);}
.breadtop canvas{position:absolute;inset:0;width:100%;height:100%;}

/* 9·10. 쌓기와 먹기 */
.stack{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;}
.layer{flex:0 0 auto;width:90%;margin-bottom:calc(var(--u)*-.6);animation:dropin .35s ease-out;position:relative;}
@keyframes dropin{from{transform:translateY(calc(var(--u)*-14));opacity:0}}
.L-bottom{height:calc(var(--u)*7);background:linear-gradient(#f6d29a,#e3ad62);border:calc(var(--u)*.8) solid #b8762f;border-radius:calc(var(--u)*2);margin-bottom:0;}
.L-egg{width:86%;height:calc(var(--u)*3.6);background:#ffd84d;border-radius:calc(var(--u)*2);}
.L-lettuce{width:97%;height:calc(var(--u)*4.6);
  background:radial-gradient(circle at 50% 0,#6cbf45 68%,transparent 71%) bottom/calc(var(--u)*4) calc(var(--u)*2) repeat-x,
             linear-gradient(#94dc66,#6cbf45) top/100% 62% no-repeat;}
.L-tomato{width:88%;height:calc(var(--u)*3.6);display:flex;gap:calc(var(--u)*.8);}
.L-tomato i{flex:1;background:radial-gradient(#ff7a6b,#d93025);border-radius:calc(var(--u)*1.6);}
.L-cheese{width:100%;height:calc(var(--u)*2.6);background:#ffc93c;border-radius:calc(var(--u)*.5);}
.L-cheese::before,.L-cheese::after{content:'';position:absolute;top:100%;border-left:calc(var(--u)*1.6) solid transparent;
  border-right:calc(var(--u)*1.6) solid transparent;border-top:calc(var(--u)*2.6) solid #ffc93c;}
.L-cheese::before{left:18%}.L-cheese::after{left:68%}
.L-top{height:calc(var(--u)*11);background:linear-gradient(#e9b064,#f6d29a 65%);border:calc(var(--u)*.8) solid #b8762f;
  border-radius:50% 50% calc(var(--u)*2) calc(var(--u)*2) / 80% 80% calc(var(--u)*2) calc(var(--u)*2);}
.tray{background:rgba(255,255,255,.6);border-radius:calc(var(--u)*4);}
.locked{opacity:.35;filter:grayscale(.6);}
.sandwich{transition:clip-path .25s,-webkit-clip-path .25s;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="progress"></div>
    <div id="home" title="길게 누르면 처음으로">🏠<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg></div>
  </div>
  <div id="stage"></div>
  <div id="caption"><span id="capIcon">🔊</span><span id="capText"></span></div>
</div>

<script>
'use strict';
const $=(s,p=document)=>p.querySelector(s);
const stage=$('#stage');
const U=()=>Math.min(innerWidth,innerHeight)/100;
const rand=(a,b)=>a+Math.random()*(b-a);

function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
// 무대 기준 % 위치에 u 단위 크기의 상자를 놓는다 (x,y는 중심)
function box(parent,cls,xPct,yPct,wU,hU,html){
  const e=el('div','obj '+(cls||''),parent,html);
  e.style.width=`calc(var(--u)*${wU})`;e.style.height=`calc(var(--u)*${hU})`;
  e.style.left=`calc(${xPct}% - var(--u)*${wU/2})`;e.style.top=`calc(${yPct}% - var(--u)*${hU/2})`;
  return e;
}
function emo(parent,ch,x,y,s,cls){const e=box(parent,'emo '+(cls||''),x,y,s,s,ch);e.style.fontSize=`calc(var(--u)*${s*0.85})`;return e;}
function sRect(){return stage.getBoundingClientRect();}
function pt(e){const r=sRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function center(elm){const r=elm.getBoundingClientRect(),s=sRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2,w:r.width,h:r.height};}
function inside(p,elm,pad=0){const c=center(elm);return Math.abs(p.x-c.x)<=c.w/2+pad&&Math.abs(p.y-c.y)<=c.h/2+pad;}

/* ---------- 소리 (Web Audio로 합성, 음원 파일 없음) ---------- */
let AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(freq,dur,type='sine',vol=.2,when=0,slideTo=null){
  if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol=.2,when=0,freq=2000,ftype='bandpass'){
  if(!AC)return;const t=AC.currentTime+when,len=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=ftype;f.frequency.value=freq;
  const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
}
const SFX={
  pop(){tone(500,.12,'sine',.25,0,1300);},
  chop(){noise(.08,.6,0,3000,'highpass');tone(160,.09,'square',.08);},
  splash(){noise(.45,.4,0,900,'lowpass');tone(300,.2,'sine',.1,0,120);},
  bubble(){tone(rand(300,600),.1,'sine',.12,0,rand(800,1100));},
  crack(){noise(.05,.6,0,4000,'highpass');noise(.06,.35,.05,2500,'bandpass');},
  squish(){tone(rand(180,240),.14,'sine',.14,0,110);},
  squirt(){noise(.25,.35,0,600,'lowpass');tone(420,.2,'sine',.1,0,200);},
  rub(){noise(.07,.1,0,1600,'bandpass');},
  good(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.1));},
  munch(){noise(.12,.45,0,1200,'bandpass');noise(.1,.35,.15,900,'bandpass');},
  fanfare(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.2,i*.15));},
  whoosh(){noise(.35,.25,0,1100,'bandpass');},
  boop(){tone(440,.1,'sine',.12);},
  lock(){tone(200,.12,'square',.06);}
};
let lastRub=0;
function rubSound(f=SFX.rub){const n=performance.now();if(n-lastRub>130){lastRub=n;f();}}

/* ---------- 음성 안내 (Safari 내장 음성 합성) ---------- */
let koVoice=null,curSay='';
function pickVoice(){const vs=speechSynthesis.getVoices();koVoice=vs.find(v=>/^ko/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){
  if(!('speechSynthesis' in window)||!t)return;
  speechSynthesis.cancel();
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(koVoice)u.voice=koVoice;u.rate=.95;u.pitch=1.25;speechSynthesis.speak(u);},60);
}
function say(t){curSay=t;$('#capText').textContent=t;speak(t);}
$('#caption').addEventListener('pointerdown',()=>speak(curSay));

/* ---------- 효과 ---------- */
function burst(x,y,emojis=['⭐','✨'],n=8){
  for(let i=0;i<n;i++){const p=el('div','particle',stage,emojis[i%emojis.length]);p.style.left=x+'px';p.style.top=y+'px';
    const a=Math.random()*Math.PI*2,d=rand(6,18)*U();p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');
    setTimeout(()=>p.remove(),950);}
}
function floatText(x,y,txt,big){const t=el('div','ftext'+(big?' big':''),stage,txt);t.style.left=x+'px';t.style.top=y+'px';setTimeout(()=>t.remove(),1050);}
function retrigger(elm,cls){elm.classList.remove(cls);void elm.offsetWidth;elm.classList.add(cls);}

/* ---------- 단계 관리 ---------- */
let cleanups=[],stepIdx=-1,stepDone=false,hintFn=null,hintEl=null,idleT=null;
function addCleanup(f){cleanups.push(f);}
function later(f,ms){const id=setTimeout(f,ms);addCleanup(()=>clearTimeout(id));return id;}
function every(f,ms){const id=setInterval(f,ms);addCleanup(()=>clearInterval(id));return id;}
function stageOn(t,f){stage.addEventListener(t,f);addCleanup(()=>stage.removeEventListener(t,f));}
function clearStage(){cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];clearTimeout(idleT);hideHint();hintFn=null;stage.innerHTML='';}

// 손가락 여러 개도 각각 추적
function strokes(h){
  const last=new Map();
  stageOn('pointerdown',e=>{const p=pt(e);last.set(e.pointerId,p);h.down&&h.down(p,e);});
  stageOn('pointermove',e=>{if(!last.has(e.pointerId))return;const p=pt(e),l=last.get(e.pointerId);last.set(e.pointerId,p);h.move&&h.move(p,l,e);});
  const up=e=>{if(!last.has(e.pointerId))return;last.delete(e.pointerId);h.up&&h.up(pt(e),e);};
  stageOn('pointerup',up);stageOn('pointercancel',up);
}
// 손가락을 따라다니는 도구(수세미, 칼, 숟가락)
function useTool(ch){
  const t=el('div','tool',stage,ch);t.style.display='none';let n=0;
  const place=p=>{t.style.left=p.x+'px';t.style.top=p.y+'px';};
  strokes({down:p=>{n++;place(p);t.style.display='block';},move:p=>place(p),up:()=>{n=Math.max(0,n-1);if(!n)t.style.display='none';}});
  return t;
}
// 끌어다 놓기 (목표 근처에만 놓아도 성공으로 처리)
function draggable(elm,getTarget,onDrop){
  let sx=0,sy=0,pid=null;
  elm.addEventListener('pointerdown',e=>{
    if(elm.dataset.locked){SFX.lock();retrigger(elm,'shake');return;}
    e.preventDefault();elm.classList.remove('wiggle');pid=e.pointerId;try{elm.setPointerCapture(pid);}catch(_){}
    sx=e.clientX;sy=e.clientY;elm.classList.add('dragging');elm.style.transition='none';SFX.boop();
  });
  elm.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;elm.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.12)`;});
  const up=e=>{
    if(e.pointerId!==pid)return;pid=null;elm.classList.remove('dragging');
    const a=elm.getBoundingClientRect(),b=getTarget().getBoundingClientRect();
    const cx=a.left+a.width/2,cy=a.top+a.height/2,pad=Math.max(b.width,b.height)*.35;
    if(cx>b.left-pad&&cx<b.right+pad&&cy>b.top-pad&&cy<b.bottom+pad)onDrop(elm);
    else{elm.style.transition='transform .35s';elm.style.transform='';}
  };
  elm.addEventListener('pointerup',up);elm.addEventListener('pointercancel',up);
}

/* ---------- 힌트 (가만히 있으면 손가락이 할 일을 보여 줌) ---------- */
function hideHint(){if(hintEl){hintEl.remove();hintEl=null;}}
function showHint(h){
  hideHint();if(!h)return;
  const res=o=>(o instanceof Element)?(o.isConnected?center(o):null):o;
  const a=res(h.at||h.from);if(!a)return;
  hintEl=el('div','hint',stage);const hand=el('div','hand',hintEl,'👆');
  hintEl.style.left=a.x+'px';hintEl.style.top=a.y+'px';
  let kf,dur=1000;
  if(h.type==='tap')kf=[{transform:'translateY(0) scale(1)'},{transform:'translateY(-18px) scale(1.1)'},{transform:'translateY(0) scale(.9)'}];
  else if(h.type==='rub')kf=[{transform:'translateX(-45px)'},{transform:'translateX(45px)'},{transform:'translateX(-45px)'}];
  else{const b=res(h.to);if(!b)return hideHint();const dx=b.x-a.x,dy=b.y-a.y;dur=1700;
    kf=[{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px)`,opacity:1,offset:.75},{transform:`translate(${dx}px,${dy}px)`,opacity:0}];}
  hand.animate(kf,{duration:dur,iterations:Infinity,easing:'ease-in-out'});
}
function resetIdle(){
  clearTimeout(idleT);hideHint();
  if(stepIdx<0||stepDone)return;
  const fire=()=>{if(stepDone)return;showHint(hintFn&&hintFn());speak(curSay);idleT=setTimeout(fire,12000);};
  idleT=setTimeout(fire,6000);
}
stage.addEventListener('pointerdown',()=>resetIdle(),true);

const PRAISE=['잘했어요!','최고예요!','우와, 멋져요!','참 잘했어요!','대단해요!'];
function renderProgress(){
  $('#progress').innerHTML=STEPS.map((s,i)=>`<div class="pdot ${i<stepIdx?'done':''} ${i===stepIdx?'cur':''}">${s.icon}</div>`).join('');
}
function startStep(i){
  clearStage();stepIdx=i;stepDone=false;renderProgress();
  STEPS[i].setup(complete);say(STEPS[i].say);resetIdle();
}
function complete(){
  if(stepDone)return;stepDone=true;clearTimeout(idleT);hideHint();
  SFX.good();const w=stage.clientWidth,h=stage.clientHeight;
  burst(w/2,h/2,['⭐','✨','🌟'],16);
  const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];floatText(w/2,h*.35,p,true);say(p);
  later(()=>{stepIdx+1<STEPS.length?startStep(stepIdx+1):showEnd();},2300);
}

/* ---------- 1. 채소 씻기 ---------- */
function stepWash(done){
  el('div','sink',stage);
  emo(stage,'🚰',50,6,11);
  el('div','stream',stage);
  const spots=[];
  const vegs=[emo(stage,'🥬',30,56,34),emo(stage,'🍅',70,58,28)];
  vegs.forEach(v=>{for(let i=0;i<5;i++){const s=el('div','dirt',v);const a=Math.random()*Math.PI*2,r=rand(.05,.28);
    s.style.left=(50+Math.cos(a)*r*100)+'%';s.style.top=(50+Math.sin(a)*r*100)+'%';s.hp=70;spots.push(s);}});
  useTool('🧽');
  const scrub=(p,d)=>{
    for(const s of spots){if(s.gone)continue;const c=center(s);
      if(Math.hypot(c.x-p.x,c.y-p.y)<c.w*.7+U()*3){s.hp-=d;s.style.opacity=Math.max(.15,s.hp/70);
        if(s.hp<=0){s.gone=true;s.classList.add('clean');SFX.bubble();burst(c.x,c.y,['🫧','💧'],4);}}}
    if(spots.every(s=>s.gone)&&!stepDone){vegs.forEach(v=>v.classList.add('shine'));done();}
  };
  strokes({down:p=>scrub(p,20),move:(p,l)=>{const d=Math.hypot(p.x-l.x,p.y-l.y);if(d<1)return;rubSound();scrub(p,d);}});
  hintFn=()=>({type:'rub',at:spots.find(s=>!s.gone)});
}

/* ---------- 2. 토마토 자르기 ---------- */
function stepCut(done){
  box(stage,'board',50,54,72,48);
  const W=40,N=4;const tom=box(stage,'',50,52,W,W);
  const segs=[];
  for(let i=0;i<N;i++){const s=el('div','seg',tom);s.style.left=(i*100/N)+'%';s.style.width=(100/N)+'%';
    const inner=el('div','seginner',s,'🍅');inner.style.width=`calc(var(--u)*${W})`;inner.style.left=`calc(var(--u)*${-i*W/N})`;
    inner.style.fontSize=`calc(var(--u)*${W*.88})`;segs.push(s);}
  const lines=[];for(let j=1;j<N;j++){const l=el('div','cutline',tom);l.style.left=(j*100/N)+'%';l.idx=j;lines.push(l);}
  useTool('🔪');
  let start=null,used=false;
  const cut=l=>{
    l.cut=true;l.classList.add('gone');SFX.chop();const c=center(l);floatText(c.x,c.y-c.h*.3,'싹둑!');
    const total=lines.filter(L=>L.cut).length;
    segs.forEach((s,i)=>{const k=lines.filter(L=>L.cut&&L.idx<=i).length;s.style.transform=`translateX(calc(var(--u)*${(k-total/2)*2.6}))`;});
    if(lines.every(L=>L.cut))later(done,500);
  };
  strokes({
    down:p=>{start=p;used=false;},
    move:p=>{if(!start||used)return;
      if(p.y-start.y>U()*W*.28&&inside(p,tom,U()*8)){
        const rest=lines.filter(l=>!l.cut);if(!rest.length)return;
        let best=rest[0],bd=1e9;rest.forEach(l=>{const d=Math.abs(center(l).x-p.x);if(d<bd){bd=d;best=l;}});
        cut(best);used=true;}},
    up:()=>{start=null;}
  });
  hintFn=()=>{const l=lines.find(l=>!l.cut);if(!l)return null;const c=center(l);return{type:'drag',from:{x:c.x,y:c.y-c.h*.4},to:{x:c.x,y:c.y+c.h*.4}};};
}

/* ---------- 냄비/가스레인지 ---------- */
function makeStove(x,y){
  const st=box(stage,'stove',x,y,56,46);
  el('div','stovetop',st);
  const flames=el('div','flames',st,'<span>🔥</span><span>🔥</span><span>🔥</span>');
  const pot=el('div','pot',st,'<div class="handle l"></div><div class="handle r"></div><div class="potbody"></div><div class="potrim"></div>');
  const water=el('div','water',pot);
  return{st,flames,pot,water,eggs:0};
}
function addEggToPot(s){const e=el('div','potegg',s.water,'🥚');e.style.left=(s.eggs?66:34)+'%';s.eggs++;}

/* ---------- 3. 계란 냄비에 넣기 ---------- */
function stepPutEgg(done){
  const s=makeStove(64,52);
  const eggs=[emo(stage,'🥚',18,32,18,'drag'),emo(stage,'🥚',18,72,18,'drag')];
  eggs.forEach(e=>draggable(e,()=>s.pot,elm=>{
    elm.remove();addEggToPot(s);SFX.splash();const c=center(s.water);burst(c.x,c.y,['💧'],8);floatText(c.x,c.y-U()*8,'퐁당!');
    if(s.eggs===2)later(done,400);
  }));
  hintFn=()=>{const e=eggs.find(e=>e.isConnected);return e?{type:'drag',from:e,to:s.water}:null;};
}

/* ---------- 4. 계란 삶기 ---------- */
function stepBoil(done){
  const s=makeStove(46,50);addEggToPot(s);addEggToPot(s);
  const btn=box(stage,'firebtn',86,74,18,18,'🔥<small>불 켜기</small>');
  const ring=box(stage,'ring',86,26,16,16,'<svg viewBox="0 0 100 100"><circle class="ringbg" cx="50" cy="50" r="44"/><circle class="ringfg" cx="50" cy="50" r="44"/></svg><div class="ringlabel">⏳</div>');
  let on=false;
  const spawn=()=>{
    const w=center(s.water),sz=U()*rand(6,9),b=el('div','bub',stage);
    b.style.width=b.style.height=sz+'px';b.style.left=(w.x+rand(-.38,.38)*w.w-sz/2)+'px';b.style.top=(w.y-sz/2)+'px';
    b.addEventListener('pointerdown',()=>{const c=center(b);SFX.pop();burst(c.x,c.y,['✨'],3);floatText(c.x,c.y,'톡!');b.remove();});
    if(Math.random()<.5)SFX.bubble();setTimeout(()=>b.remove(),2650);
  };
  btn.addEventListener('pointerdown',()=>{
    if(on)return;on=true;btn.classList.add('on');s.flames.classList.add('on');ring.classList.add('on');SFX.whoosh();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ring.querySelector('.ringfg').style.strokeDashoffset=0;}));
    say('보글보글! 거품을 톡톡 터뜨려 볼까요?');every(spawn,450);
    later(()=>{s.flames.classList.remove('on');done();},10000);
  });
  hintFn=()=>on?{type:'tap',at:stage.querySelector('.bub')}:{type:'tap',at:btn};
}

/* ---------- 5. 계란 깨기 ---------- */
function stepCrack(done){
  box(stage,'plate',50,64,56,18);
  const egg=box(stage,'egg shell',50,46,30,38,'<svg class="cracks" viewBox="0 0 100 130" preserveAspectRatio="none"></svg>');
  const svg=egg.querySelector('svg');let n=0;const NEED=5;
  egg.addEventListener('pointerdown',e=>{
    if(n>=NEED)return;n++;SFX.crack();retrigger(egg,'shake');
    const p=pt(e),c=center(egg);floatText(p.x,p.y,'톡!');
    let x=((p.x-(c.x-c.w/2))/c.w)*100,y=((p.y-(c.y-c.h/2))/c.h)*130;const pts=[[x,y]];const a=Math.random()*Math.PI*2;
    for(let i=0;i<6;i++){const side=(i%2?1:-1)*rand(3,7);x+=Math.cos(a)*9-Math.sin(a)*side;y+=Math.sin(a)*9+Math.cos(a)*side;pts.push([x,y]);}
    const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('points',pts.map(q=>q.join(',')).join(' '));
    pl.setAttribute('fill','none');pl.setAttribute('stroke','#6b4a2b');pl.setAttribute('stroke-width','2.4');pl.setAttribute('stroke-linejoin','round');
    svg.appendChild(pl);
    if(n>=NEED)later(done,450);
  });
  hintFn=()=>({type:'tap',at:egg});
}

/* ---------- 6. 껍질 까기 ---------- */
function stepPeel(done){
  box(stage,'plate',50,64,56,18);
  const egg=box(stage,'egg peeled',50,46,30,38);
  const pieces=[];const C=3,R=3;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const pc=el('div','shellpc',egg);pc.style.left=(c*100/C)+'%';pc.style.top=(r*100/R)+'%';pc.style.width=(100/C)+'%';pc.style.height=(100/R)+'%';
    const j=()=>rand(1.5,7).toFixed(1)+'%',k=()=>(100-rand(1.5,7)).toFixed(1)+'%';
    pc.style.clipPath=pc.style.webkitClipPath=`polygon(${j()} ${j()},50% ${j()},${k()} ${j()},${k()} 50%,${k()} ${k()},50% ${k()},${j()} ${k()},${j()} 50%)`;
    pieces.push(pc);
  }
  const peel=(pc,p)=>{
    pc.gone=true;pc.style.opacity=0;SFX.pop();const c=center(pc);
    const f=el('div','flypiece',stage);f.style.left=c.x+'px';f.style.top=c.y+'px';
    const a=Math.atan2(c.y-center(egg).y,c.x-center(egg).x)+rand(-.5,.5),d=U()*rand(25,40);
    f.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+U()*10}px) rotate(${rand(-300,300)}deg)`,opacity:0}],
      {duration:700,easing:'ease-out',fill:'forwards'});
    setTimeout(()=>f.remove(),720);
    if(pieces.every(q=>q.gone)){egg.classList.add('shine');later(done,300);}
  };
  const check=p=>{for(const pc of pieces){if(pc.gone)continue;const c=center(pc);if(Math.hypot(c.x-p.x,c.y-p.y)<Math.max(c.w,c.h)*.55){peel(pc,p);}}};
  strokes({down:check,move:check});
  hintFn=()=>({type:'tap',at:pieces.find(q=>!q.gone)});
}

/* ---------- 7. 으깨기 + 마요네즈 ---------- */
function stepMash(done){
  const bowl=box(stage,'bowl',50,60,64,38,'<div class="body"></div><div class="rim"></div>');
  const ins=el('div','inside',bowl);
  const mash=el('div','mash',ins,'<div class="pale"></div>');
  const chunks=[];for(let i=0;i<8;i++){const c=el('div','chunk',ins);const s=rand(7,10);
    c.style.width=`calc(var(--u)*${s})`;c.style.height=`calc(var(--u)*${s*.8})`;c.style.left=rand(12,78)+'%';c.style.top=rand(10,60)+'%';
    c.style.marginLeft=c.style.marginTop=`calc(var(--u)*${-s/2})`;chunks.push(c);}
  useTool('🥄');
  let phase=1,total=0,bottle=null;const blobs=[];
  const need=()=>center(bowl).w*(phase===1?5:2.5);
  strokes({move:(p,l)=>{
    if(phase!==1&&phase!==3)return;if(!inside(p,ins,U()*5))return;
    const d=Math.hypot(p.x-l.x,p.y-l.y);if(d<1)return;rubSound(SFX.squish);total+=d;
    const pr=Math.min(1,total/need());
    if(phase===1){chunks.forEach(c=>{c.style.transform=`scale(${1-pr*.85})`;c.style.opacity=1-pr*.7;});mash.style.transform=`scale(${pr})`;
      if(pr>=1){phase=2;chunks.forEach(c=>c.remove());startMayo();}}
    else{blobs.forEach(b=>b.style.opacity=1-pr);mash.querySelector('.pale').style.opacity=pr;
      if(pr>=1){phase=4;done();}}
  }});
  function startMayo(){
    SFX.good();say('마요네즈를 쭉 짜요! 통을 톡톡 눌러요.');
    bottle=box(stage,'mayo',84,28,14,26,'<div class="cap"></div><div class="tube">마요</div>');bottle.classList.add('wiggle');
    let taps=0;
    bottle.addEventListener('pointerdown',()=>{
      if(phase!==2)return;taps++;bottle.classList.remove('wiggle');retrigger(bottle,'squeeze');SFX.squirt();
      const b=el('div','blob',ins);b.style.left=rand(20,60)+'%';b.style.top=rand(15,45)+'%';blobs.push(b);
      const c=center(b);floatText(c.x,c.y-U()*5,'쭉!');
      if(taps>=3){phase=3;total=0;later(()=>{bottle.remove();say('이제 쓱쓱 섞어요!');},500);}
    });
  }
  hintFn=()=>phase===2?{type:'tap',at:bottle}:{type:'rub',at:ins};
}

/* ---------- 8. 빵에 바르기 ---------- */
function stepSpread(done){
  box(stage,'board',50,54,62,56);
  const bread=box(stage,'breadtop',50,52,46,44);
  const cv=el('canvas','',bread);const ctx=cv.getContext('2d');
  const G=8,cells=new Set();
  const fit=()=>{const dpr=window.devicePixelRatio||1;if(!cv.clientWidth)return;
    if(cv.width!==Math.round(cv.clientWidth*dpr)){const old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;
      if(cv.width)old.getContext('2d').drawImage(cv,0,0);cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);
      if(old.width)ctx.drawImage(old,0,0,cv.width,cv.height);}};
  requestAnimationFrame(fit);const onR=()=>fit();addEventListener('resize',onR);addCleanup(()=>removeEventListener('resize',onR));
  useTool('🥄');
  const dab=p=>{
    const r=cv.getBoundingClientRect(),s=sRect();const lx=(p.x-(r.left-s.left))/r.width,ly=(p.y-(r.top-s.top))/r.height;
    if(lx<-.15||lx>1.15||ly<-.15||ly>1.15)return;
    const R=.1;ctx.fillStyle='rgba(255,214,70,.95)';ctx.beginPath();ctx.ellipse(lx*cv.width,ly*cv.height,R*cv.width,R*cv.height,0,0,Math.PI*2);ctx.fill();
    if(Math.random()<.4){ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc((lx+rand(-.05,.05))*cv.width,(ly+rand(-.05,.05))*cv.height,cv.width*.012,0,Math.PI*2);ctx.fill();}
    for(let gx=0;gx<G;gx++)for(let gy=0;gy<G;gy++){if(Math.hypot((gx+.5)/G-lx,(gy+.5)/G-ly)<R*1.1)cells.add(gx+','+gy);}
  };
  const line=(a,b)=>{const steps=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/(U()*1.5)));for(let i=1;i<=steps;i++)dab({x:a.x+(b.x-a.x)*i/steps,y:a.y+(b.y-a.y)*i/steps});};
  const check=()=>{if(!stepDone&&cells.size/(G*G)>=.8){bread.classList.add('shine');done();}};
  strokes({down:p=>{fit();dab(p);check();},move:(p,l)=>{rubSound();line(l,p);check();}});
  hintFn=()=>{let best=null;for(let gx=0;gx<G&&!best;gx++)for(let gy=0;gy<G;gy++)if(!cells.has(gx+','+gy)){best=[gx,gy];break;}
    if(!best)return null;const r=center(bread);return{type:'rub',at:{x:r.x-r.w/2+(best[0]+.5)/G*r.w,y:r.y-r.h/2+(best[1]+.5)/G*r.h}};};
}

/* ---------- 9. 쌓기 ---------- */
function layer(parent,k){const d=el('div','layer L-'+k,parent);if(k==='tomato')d.innerHTML='<i></i><i></i><i></i>';return d;}
function stepStack(done){
  box(stage,'plate',50,58,66,14);
  const stack=box(stage,'stack',50,38,60,44);layer(stack,'bottom');layer(stack,'egg');
  box(stage,'tray',50,86,84,20);
  const items=[{k:'lettuce',e:'🥬',x:20},{k:'tomato',e:'🍅',x:40},{k:'cheese',e:'🧀',x:60},{k:'top',e:'🍞',x:80}];
  let placed=0;
  items.forEach(it=>{
    it.el=emo(stage,it.e,it.x,86,16,'drag');
    if(it.k==='top'){it.el.dataset.locked=1;it.el.classList.add('locked');}
    draggable(it.el,()=>stack,elm=>{
      elm.remove();it.done=true;layer(stack,it.k);SFX.pop();const c=center(stack);burst(c.x,c.y,['✨'],5);
      if(it.k==='top'){later(done,400);return;}
      placed++;
      if(placed===3){const t=items[3].el;delete t.dataset.locked;t.classList.remove('locked');t.classList.add('wiggle');say('마지막으로 빵을 덮어요!');}
    });
  });
  hintFn=()=>{const it=items.find(i=>!i.done&&!i.el.dataset.locked);return it?{type:'drag',from:it.el,to:stack}:null;};
}

/* ---------- 10. 먹기 ---------- */
function stepEat(done){
  box(stage,'plate',50,66,70,16);
  const sw=box(stage,'stack sandwich',50,44,60,44);
  ['bottom','egg','lettuce','tomato','cheese','top'].forEach(k=>layer(sw,k));
  let bites=0;
  sw.addEventListener('pointerdown',e=>{
    if(bites>=5)return;bites++;SFX.munch();const p=pt(e);floatText(p.x,p.y,'냠!');
    const c=center(sw);burst(c.x+c.w/2-c.w*bites*.2,c.y,['🍞','✨'],5);
    sw.style.clipPath=sw.style.webkitClipPath=`inset(0 ${bites*20}% 0 0)`;
    if(bites>=5)later(done,500);
  });
  hintFn=()=>({type:'tap',at:sw});
}

const STEPS=[
  {icon:'🧽',say:'채소에 묻은 흙을 쓱쓱 문질러서 깨끗하게 씻어요!',setup:stepWash},
  {icon:'🔪',say:'토마토를 잘라요. 하얀 점선을 위에서 아래로 쓱 내려요!',setup:stepCut},
  {icon:'🥚',say:'계란을 꾹 잡고 냄비 안으로 쏙 넣어요!',setup:stepPutEgg},
  {icon:'♨️',say:'빨간 불 버튼을 눌러서 계란을 삶아요!',setup:stepBoil},
  {icon:'💥',say:'삶은 계란을 톡톡 두드려서 깨 볼까요?',setup:stepCrack},
  {icon:'🤏',say:'계란 껍질을 손가락으로 쏙쏙 떼어 내요!',setup:stepPeel},
  {icon:'🥄',say:'그릇 안을 쓱쓱 문질러서 계란을 으깨요!',setup:stepMash},
  {icon:'🍞',say:'빵 위에 계란을 쓱쓱 발라요!',setup:stepSpread},
  {icon:'🥬',say:'재료를 빵 위로 하나씩 옮겨서 쌓아요!',setup:stepStack},
  {icon:'😋',say:'샌드위치 완성! 샌드위치를 눌러서 냠냠 먹어요!',setup:stepEat},
];

/* ---------- 시작 / 끝 화면 ---------- */
function showTitle(){
  clearStage();stepIdx=-1;renderProgress();
  const sc=el('div','screen',stage);
  el('div','bigemo',sc,'🥪');el('div','title',sc,'샌드위치 만들기');
  const b=el('button','bigbtn',sc,'시작하기 ▶');
  b.addEventListener('click',()=>{audioInit();SFX.good();startStep(0);});
  curSay='시작하기 버튼을 눌러요!';$('#capText').textContent=curSay;
}
function showEnd(){
  clearStage();stepIdx=STEPS.length;renderProgress();stepDone=true;
  const sc=el('div','screen',stage);
  el('div','bigemo',sc,'🏆');el('div','title',sc,'샌드위치 요리사 완성!');
  const b=el('button','bigbtn',sc,'다시 하기 🔄');
  b.addEventListener('click',()=>{audioInit();startStep(0);});
  SFX.fanfare();say('참 잘했어요! 맛있는 샌드위치를 다 만들었어요!');
  const w=stage.clientWidth;let n=0;
  const id=every(()=>{burst(rand(0,w),rand(0,stage.clientHeight*.4),['⭐','🌟','🎉'],4);if(++n>12)clearInterval(id);},300);
}

/* ---------- 처음으로 (길게 누르기, 아이가 실수로 누르지 않게) ---------- */
const home=$('#home');let hpT=null;
home.addEventListener('pointerdown',e=>{e.preventDefault();home.classList.add('holding');hpT=setTimeout(()=>{home.classList.remove('holding');speechSynthesis&&speechSynthesis.cancel();showTitle();},1200);});
['pointerup','pointercancel','pointerleave'].forEach(t=>home.addEventListener(t,()=>{clearTimeout(hpT);home.classList.remove('holding');}));

/* ---------- iPad 제스처(확대, 스크롤) 막기 ---------- */
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

showTitle();
