<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>음성 문장 목록</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; margin: 20px; color: #2d3a4a; }
  #sum { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  #err { color: #c0392b; font-weight: 700; white-space: pre-line; }
  textarea { width: 100%; height: 70vh; font-family: Consolas, monospace; font-size: 13px; }
  button { font-size: 16px; padding: 6px 14px; margin-bottom: 10px; }
  iframe { display: none; }
</style>
</head>
<body>
<!--
  개발용 도구입니다 (아이 화면에는 나오지 않음).
  각 놀이의 voiceLines()를 모아, 중복을 빼고 mp3 이름(문장 해시)을 붙인 문장표를 만듭니다.
  로컬 웹서버에서 /tools/voice-lines.html을 열고, 결과를 docs/음성문장.txt에 붙여 넣습니다.
-->
<div id="sum">불러오는 중…</div>
<div id="err"></div>
<button id="copy">복사</button>
<textarea id="out" readonly></textarea>
<script>
'use strict';
const GAMES = [['index', '../index.html'], ['cooking', '../cooking.html'], ['hangul', '../hangul.html'], ['numbers', '../numbers.html']];
const load = ([name, src]) => new Promise((ok, no) => {
  const f = document.createElement('iframe'); f.src = src;
  f.onload = () => {
    // VOICE는 const라 window 속성이 아니므로 놀이 화면 안에서 eval로 꺼냅니다 (같은 놀이의 이름 규칙을 그대로 씀)
    try { const w = f.contentWindow, V = w.eval('VOICE'); ok({ name, lines: w.voiceLines(), norm: V.norm, hash: V.hash }); }
    catch (e) { no(new Error(`${name}: ${e.message}`)); }
  };
  document.body.appendChild(f);
});
Promise.all(GAMES.map(load)).then(rs => {
  const map = new Map();   // 문장 → { hash, games }
  const errs = [];
  rs.forEach(r => r.lines.forEach(t => {
    t = r.norm(t); if (!t) return;
    if (!map.has(t)) map.set(t, { hash: r.hash(t), games: new Set() });
    map.get(t).games.add(r.name);
  }));
  const byHash = new Map();
  map.forEach((v, t) => { if (byHash.has(v.hash)) errs.push(`해시 겹침: ${byHash.get(v.hash)} / ${t}`); byHash.set(v.hash, t); });
  const rows = [...map].map(([t, v]) => [v.hash, t, [...v.games].join(',')]);
  const chars = rows.reduce((n, r) => n + r[1].length, 0);
  const per = GAMES.map(([g]) => `${g} ${rows.filter(r => r[2].split(',').includes(g)).length}`).join(', ');
  document.getElementById('sum').textContent = `문장 ${rows.length}개, 글자 ${chars}자 (${per})`;
  document.getElementById('err').textContent = errs.join('\n');
  // value 대신 textContent로 넣어, 화면 없는 브라우저의 --dump-dom 결과에도 문장표가 나오게 함
  document.getElementById('out').textContent = [
    '# 음성 문장 목록 (tools/voice-lines.html로 만듦. 직접 고치지 않습니다)',
    `# 문장 ${rows.length}개, 글자 ${chars}자`,
    '# 형식: mp3 이름<TAB>문장<TAB>쓰는 놀이',
    ...rows.map(r => r.join('\t'))
  ].join('\n') + '\n';
  window.VOICE_TABLE = { rows, chars, errs };
}).catch(e => { document.getElementById('err').textContent = e.message; });
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(document.getElementById('out').value);
</script>
</body>
</html>
